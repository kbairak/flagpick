        - {name: Blame porcelain, kind: flag, type: bool, long: --porcelain, short: "-p", description: "show in a format designed for machine consumption"}
        - {name: Blame line porcelain, kind: flag, type: bool, long: --line-porcelain, description: "Show the porcelain format, but output commit information for each line, not just the first time a commit is referenced. Implies --porcelain."}
        - {name: Blame show email, kind: flag, type: bool, long: --show-email, short: "-e", description: "Show the author email instead of the author name (Default: off). This can also be controlled via the blame.showEmail config option."}
