      [Grep cached, Grep untracked, Grep exclude standard, Grep invert match,
       Grep word regexp, Grep text, Grep no text, Grep extended regexp,
       Grep basic regexp, Grep fixed strings, Grep perl regexp, Ignore case,
       Grep line number, Grep column, Grep full name, Grep files with matches,
       Grep files without match, Grep null, Grep only matching, Grep count,
       Grep break, Grep heading, Grep context, Grep before context,
       Grep after context, Grep max count, Grep show function,
       Grep function context, Quiet, Grep threads, Grep recurse submodules,
       Grep pattern, Revision, Pathspec]

  - name: remote
    description: Manage the set of repositories ("remotes") whose branches you track.
    usage: git remote [-v] <subcommand>
    options: [Verbose]
    subcommands:
      - name: add
        description: Add a remote named <name> for the repository at <url>.
        usage: git remote add [<options>] <name> <url>
        pool:
          options:
            - {name: Remote add track, kind: flag, type: string, long: --track, short: "-t", repeatable: true, description: "branch(es) to track"}
            - {name: Remote add fetch, kind: flag, type: bool, long: --fetch, short: "-f", description: "fetch the remote branches"}
            - {name: Remote add no tags, kind: flag, type: bool, long: --no-tags, description: "import all tags and associated objects when fetching"}
            - {name: Remote add mirror, kind: flag, type: enum, long: --mirror, values: [fetch, push], description: "set up remote as a mirror to push to or fetch from"}
            - {name: Remote name, kind: positional, type: string, required: true, description: "The remote name."}
            - {name: Remote url, kind: positional, type: string, required: true, description: "The URL of the remote."}
        options: [Tags, Remote add track, Remote add fetch, Remote add no tags, Remote add mirror, Remote name, Remote url]

      - name: remove
        description: Remove the remote named <name>.
        usage: git remote remove <name>
        pool:
          options:
            - {name: Remote remove name, kind: positional, type: string, required: true, description: "The remote to remove."}
        options: [Remote remove name]

      - name: rename
        description: Rename the remote named <old> to <new>.
        usage: git remote rename <old> <new>
        pool:
          options:
            - {name: Remote old name, kind: positional, type: string, required: true, description: "The remote to rename."}
            - {name: Remote new name, kind: positional, type: string, required: true, description: "The new remote name."}
        options: [Progress, Remote old name, Remote new name]

      - name: show
        description: Give some information about the remote <name>.
        usage: git remote show [-n] <name>
        pool:
          options:
            - {name: Remote show name, kind: positional, type: string, required: true, description: "The remote to show."}
        options: [Verbose, Remote show name]

      - name: prune
        description: Delete stale references associated with <name>.
        usage: git remote prune [-n] <name>
        pool:
          options:
            - {name: Remote prune name, kind: positional, type: string, required: true, description: "The remote to prune."}
        options: [Dry run, Remote prune name]

      - name: update
        description: Fetch updates for remotes or remote groups.
        usage: git remote update [-p] [<remote>...]
        pool:
          options:
            - {name: Remote update names, kind: positional, type: string, required: false, variadic: true, description: "The remotes (or groups) to update."}
        options: [Prune, Remote update names]

      - name: set-head
        description: Set or delete the default branch for a remote.
        usage: git remote set-head <name> (-a | -d | <branch>)
        pool:
          options:
            - {name: Remote set-head auto, kind: flag, type: bool, long: --auto, short: "-a", description: "set refs/remotes/<name>/HEAD according to remote"}
            - {name: Remote set-head delete, kind: flag, type: bool, long: --delete, short: "-d", description: "delete refs/remotes/<name>/HEAD"}
            - {name: Remote set-head name, kind: positional, type: string, required: true, description: "The remote to set the default branch for."}
            - {name: Remote set-head branch, kind: positional, type: string, required: false, description: "The branch to set as the remote's default."}
        options: [Remote set-head auto, Remote set-head delete, Remote set-head name, Remote set-head branch]

      - name: set-url
        description: Change the URL of a remote.
        usage: git remote set-url [<options>] <name> <newurl> [<oldurl>]
        pool:
          options:
            - {name: Remote set-url push, kind: flag, type: bool, long: --push, description: "manipulate push URLs"}
            - {name: Remote set-url add, kind: flag, type: bool, long: --add, description: "add URL"}
            - {name: Remote set-url delete, kind: flag, type: bool, long: --delete, description: "delete URLs"}
            - {name: Remote set-url name, kind: positional, type: string, required: true, description: "The remote to change the URL of."}
            - {name: Remote set-url new url, kind: positional, type: string, required: true, description: "The new URL."}
            - {name: Remote set-url old url, kind: positional, type: string, required: false, description: "The URL to replace."}
        options: [Remote set-url push, Remote set-url add, Remote set-url delete, Remote set-url name, Remote set-url new url, Remote set-url old url]

      - name: get-url
        description: Retrieve the URLs for a remote.
        usage: git remote get-url [<options>] <name>
        pool:
          options:
            - {name: Remote get-url push, kind: flag, type: bool, long: --push, description: "query push URLs rather than fetch URLs"}
            - {name: Remote get-url all, kind: flag, type: bool, long: --all, description: "return all URLs"}
            - {name: Remote get-url name, kind: positional, type: string, required: true, description: "The remote to query."}
        options: [Remote get-url push, Remote get-url all, Remote get-url name]

  - name: stash
    description: Stash the changes in a dirty working directory away.
    usage: git stash <subcommand>
    subcommands:
      - name: push
        description: Save your local modifications to a new stash.
        usage: git stash push [<options>] [<pathspec>...]
        pool:
          options:
            - {name: Stash push patch, kind: flag, type: bool, long: --patch, short: "-p", description: "stash in patch mode"}
            - {name: Stash push staged, kind: flag, type: bool, long: --staged, short: "-S", description: "stash staged changes only"}
            - {name: Stash push keep index, kind: flag, type: bool, long: --keep-index, short: "-k", description: "This option is only valid for push and save commands."}
            - {name: Stash push untracked, kind: flag, type: bool, long: --include-untracked, short: "-u", description: "include untracked files in stash"}
            - {name: Stash push all, kind: flag, type: bool, long: --all, short: "-a", description: "include ignore files"}
            - {name: Stash push message, kind: flag, type: string, long: --message, short: "-m", description: "stash message"}
        options: [Quiet, Stash push patch, Stash push staged, Stash push keep index, Stash push untracked, Stash push all, Stash push message, Pathspec]

      - name: pop
        description: Remove a single stashed state and apply it.
        usage: git stash pop [<options>] [<stash>]
        pool:
          options:
            - {name: Stash pop index, kind: flag, type: bool, long: --index, description: "attempt to recreate the index"}
            - {name: Stash pop name, kind: positional, type: string, required: false, description: "The stash to pop."}
        options: [Quiet, Stash pop index, Stash pop name]

      - name: apply
        description: Apply a stashed state.
        usage: git stash apply [<options>] [<stash>]
        pool:
          options:
            - {name: Stash apply index, kind: flag, type: bool, long: --index, description: "attempt to recreate the index"}
            - {name: Stash apply name, kind: positional, type: string, required: false, description: "The stash to apply."}
        options: [Quiet, Stash apply index, Stash apply name]

      - name: list
        description: List the stashes that you currently have.
        usage: git stash list [<log-options>]
        options: [Max count, Stat, Patch]

      - name: show
        description: Show the changes recorded in a stash.
        usage: git stash show [<options>] [<stash>]
        pool:
          options:
            - {name: Stash show untracked, kind: flag, type: bool, long: --include-untracked, short: "-u", description: "include untracked files in the stash"}
            - {name: Stash show only untracked, kind: flag, type: bool, long: --only-untracked, description: "only show untracked files in the stash"}
            - {name: Stash show name, kind: positional, type: string, required: false, description: "The stash to show."}
        options: [Stat, Patch, Stash show untracked, Stash show only untracked, Stash show name]

      - name: drop
        description: Remove a single stashed state from the stash list.
        usage: git stash drop [<options>] [<stash>]
        pool:
          options:
            - {name: Stash drop name, kind: positional, type: string, required: false, description: "The stash to drop."}
        options: [Quiet, Stash drop name]

      - name: branch
        description: Create and check out a new branch starting from a stash.
        usage: git stash branch <branchname> [<stash>]
        pool:
          options:
            - {name: Stash branch name, kind: positional, type: string, required: true, description: "The branch or stash to create a branch from."}
            - {name: Stash branch stash, kind: positional, type: string, required: false, description: "The stash to create a branch from."}
        options: [Stash branch name, Stash branch stash]

      - name: clear
        description: Remove all the stashed states.
        usage: git stash clear
        options: []

      - name: create
        description: Create a stash without storing it.
        usage: git stash create [<message>]
        pool:
          options:
            - {name: Stash create message, kind: positional, type: string, required: false, description: "The message for the stash."}
        options: [Stash create message]

  - name: config
    description: Get and set repository or global options.
    usage: git config <subcommand>
    pool:
      options:
        - {name: Config global, kind: flag, type: bool, long: --global, description: "For writing options: write to global ~/.gitconfig file rather than the repository .git/config, write to $XDG_CONFIG_HOME/git/config file if this file exists and the ~/.gitconfig file doesn’t."}
        - {name: Config local, kind: flag, type: bool, long: --local, description: "For writing options: write to the repository .git/config file. This is the default behavior."}
        - {name: Config worktree, kind: flag, type: bool, long: --worktree, description: "Similar to --local except that $GIT_DIR/config.worktree is read from or written to if extensions.worktreeConfig is enabled. If not it’s the same as --local. Note that $GIT_DIR is equal to $GIT_COMMON_DIR for the main working tree, but is of the form $GIT_DIR/worktrees/<id>/ for other working trees. See git- worktree(1) to learn how to enable extensions.worktreeConfig."}
        - {name: Config file, kind: flag, type: string, long: --file, short: "-f", description: "read message from file"}
        - {name: Config type, kind: flag, type: enum, long: --type, values: [bool, int, bool-or-int, path, expiry-date, color], description: "Un-sets the previously set type specifier (if one was previously set). This option requests that git config not canonicalize the retrieved variable. --no-type has no effect without --type=<type> or --<type>."}
        - {name: Config all, kind: flag, type: bool, long: --all, description: "With get, return all values for a multi-valued key."}
        - {name: Config regexp, kind: flag, type: bool, long: --regexp, description: "With get, interpret the name as a regular expression. Regular expression matching is currently case-sensitive and done against a canonicalized version of the key in which section and variable names are lowercased, but subsection names are not."}
        - {name: Config fixed value, kind: flag, type: bool, long: --fixed-value, description: "When used with the value-pattern argument, treat value-pattern as an exact string instead of a regular expression. This will restrict the name/value pairs that are matched to only those where the value is exactly equal to the value-pattern."}
        - {name: Config default, kind: flag, type: string, long: --default, description: "use default value when missing entry"}
        - {name: Config includes, kind: flag, type: bool, long: --includes, description: "respect include directives on lookup"}
        - {name: Config show origin, kind: flag, type: bool, long: --show-origin, description: "Augment the output of all queried config options with the origin type (file, standard input, blob, command line) and the actual origin (config file path, ref, or blob id if applicable)."}
        - {name: Config show scope, kind: flag, type: bool, long: --show-scope, description: "Similar to --show-origin in that it augments the output of all queried config options with the scope of that value (worktree, local, global, system, command)."}
        - {name: Config null, kind: flag, type: bool, long: --null, short: "-z", description: "For all options that output values and/or keys, always end values with the null character (instead of a newline). Use newline instead as a delimiter between key and value. This allows for secure parsing of the output without getting confused e.g. by values that contain line breaks."}
        - {name: Config name only, kind: flag, type: bool, long: --name-only, description: "Output only the names of config variables for list or get."}
    subcommands:
      - name: get
        description: Emit the value of the given configuration variable.
        usage: git config get [<options>] <name>
        pool:
          options:
            - {name: Config get name, kind: positional, type: string, required: true, description: "The config key to read."}
        options: [Config global, Config local, Config type, Config all, Config regexp, Config fixed value, Config default, Config includes, Config show origin, Config get name]

      - name: set
        description: Set the value of a configuration variable.
        usage: git config set [<options>] <name> <value>
        pool:
          options:
            - {name: Config set name, kind: positional, type: string, required: true, description: "The config key to set."}
            - {name: Config set value, kind: positional, type: string, required: true, description: "The value to set."}
        options: [Config global, Config local, Config type, Config all, Config fixed value, Config set name, Config set value]

      - name: unset
        description: Remove the value of a configuration variable.
        usage: git config unset [<options>] <name>
        pool:
          options:
            - {name: Config unset name, kind: positional, type: string, required: true, description: "The config key to remove."}
        options: [Config global, Config local, Config all, Config fixed value, Config unset name]

      - name: list
        description: List all configuration variables and their values.
        usage: git config list [<options>]
        options: [Config global, Config local, Config includes, Config show origin, Config show scope, Config null, Config name only]

      - name: edit
        description: Open an editor to modify the specified config file.
        usage: git config edit [<options>]
        options: [Config global, Config local]

      - name: rename-section
        description: Rename a section in the config file.
        usage: git config rename-section <old-name> <new-name>
        pool:
          options:
            - {name: Config old section, kind: positional, type: string, required: true, description: "The section to rename from."}
            - {name: Config new section, kind: positional, type: string, required: true, description: "The new section name."}
        options: [Config global, Config local, Config old section, Config new section]

      - name: remove-section
        description: Remove a section from the config file.
        usage: git config remove-section <name>
        pool:
          options:
            - {name: Config section, kind: positional, type: string, required: true, description: "The config section."}
        options: [Config global, Config local, Config section]
