        - {name: Blame color by age, kind: flag, type: bool, long: --color-by-age, description: "color lines by age"}
        - {name: Blame minimal, kind: flag, type: bool, long: --minimal, description: "spend extra cycles to find better match"}
        - {name: Blame line range, kind: flag, type: string, long: --line-range, short: "-L", description: "Process only the given line range (start,end) or function."}
