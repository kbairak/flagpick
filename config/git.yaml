description: The stupid content tracker.

pool:
  options:
    # -- global options (must precede the subcommand) --
    - {name: Git dir,        kind: flag, type: string, long: --git-dir, description: "Set the path to the repository (\".git\" directory). This can also be controlled by setting the GIT_DIR environment variable. It can be an absolute path or relative path to current working directory."}
    - {name: Work tree,      kind: flag, type: string, long: --work-tree, description: "Set the path to the working tree. It can be an absolute path or a path relative to the current working directory. This can also be controlled by setting the GIT_WORK_TREE environment variable and the core.worktree configuration variable (see core.worktree in git- config(1) for a more detailed discussion)."}
    - {name: Namespace,      kind: flag, type: string, long: --namespace, description: "Set the Git namespace. See gitnamespaces(7) for more details. Equivalent to setting the GIT_NAMESPACE environment variable."}
    - {name: Config env,     kind: flag, type: string, long: --config-env, repeatable: true, description: "Like -c <name>=<value>, give configuration variable <name> a value, where <envvar> is the name of an environment variable from which to retrieve the value. Unlike -c there is no shortcut for directly setting the value to an empty string, instead the environment variable itself must be set to the empty string. It is an error if the <envvar> does not exist in the environment. <envvar> may not contain an equals sign to avoid ambiguity with <name> containing one."}
    - {name: Exec path,      kind: flag, type: string, long: --exec-path, description: "Path to wherever your core Git programs are installed. This can also be controlled by setting the GIT_EXEC_PATH environment variable. If no path is given, git will print the current setting and then exit."}
    - {name: Bare,           kind: flag, type: bool, long: --bare, description: "create a bare repository"}
    - {name: Paginate,       kind: flag, type: bool, long: --paginate, short: "-p", negative: --no-pager, negative_short: "-P", description: "Pipe all output into less (or if set, $PAGER) if standard output is a terminal. This overrides the pager.<cmd> configuration options (see the \"Configuration Mechanism\" section below)."}
    - {name: No replace objects, kind: flag, type: bool, long: --no-replace-objects, description: "Do not use replacement refs to replace Git objects. This is equivalent to exporting the GIT_NO_REPLACE_OBJECTS environment variable with any value. See git-replace(1) for more information."}
    - {name: No lazy fetch,  kind: flag, type: bool, long: --no-lazy-fetch, description: "Do not fetch missing objects from the promisor remote on demand. Useful together with git cat-file -e <object> to see if the object is locally available. This is equivalent to setting the GIT_NO_LAZY_FETCH environment variable to 1."}
    - {name: No optional locks, kind: flag, type: bool, long: --no-optional-locks, description: "Do not perform optional operations that require locks. This is equivalent to setting the GIT_OPTIONAL_LOCKS to 0."}
    - {name: No advice,      kind: flag, type: bool, long: --no-advice, description: "Disable all advice hints from being printed."}
    - {name: Html path,      kind: flag, type: bool, long: --html-path, description: "Print the path, without trailing slash, where Git’s HTML documentation is installed and exit."}
    - {name: Man path,       kind: flag, type: bool, long: --man-path, description: "Print the manpath (see man(1)) for the man pages for this version of Git and exit."}
    - {name: Info path,      kind: flag, type: bool, long: --info-path, description: "Print the path where the Info files documenting this version of Git are installed and exit."}
    - {name: Version,        kind: flag, type: bool, long: --version, short: "-v", description: "Prints the Git suite version that the git program came from."}
    - {name: Help,           kind: flag, type: bool, long: --help, short: "-h", description: "Prints the synopsis and a list of the most commonly used commands. If the option --all or -a is given then all available commands are printed. If a Git command is named this option will bring up the manual page for that command."}

    # -- options shared by many subcommands (inherited, not on root) --
    - {name: Quiet,     kind: flag, type: bool, long: --quiet, short: "-q", description: "suppress informational messages"}
    - {name: Verbose,   kind: flag, type: bool, long: --verbose, short: "-v", description: "be verbose"}
    - {name: Force,     kind: flag, type: bool, long: --force, short: "-f", description: "allow adding otherwise ignored files"}
    - {name: Dry run,   kind: flag, type: bool, long: --dry-run, short: "-n", description: "dry run"}
    - {name: Patch,     kind: flag, type: bool, long: --patch, short: "-p", description: "select hunks interactively"}
    - {name: Progress,  kind: flag, type: bool, long: --progress, description: "force progress reporting"}
    - {name: Recurse submodules, kind: flag, type: bool, long: --recurse-submodules, description: "recurse through submodules"}
    - {name: Set upstream, kind: flag, type: bool, long: --set-upstream, short: "-u", description: "set upstream for git pull/fetch"}
    - {name: Tags,      kind: flag, type: bool, long: --tags, short: "-t", description: "clone tags, and make later fetches not to follow them"}
    - {name: Prune,     kind: flag, type: bool, long: --prune, short: "-p", description: "prune remote-tracking branches no longer on remote"}
    - {name: All,       kind: flag, type: bool, long: --all, short: "-a", description: "add changes from all tracked and untracked files"}
    - {name: Color,     kind: flag, type: enum, long: --color, values: [always, auto, never], description: "Color branches to highlight current, local, and remote-tracking branches. The value must be always (the default), never, or auto."}
    - {name: Ignore case, kind: flag, type: bool, long: --ignore-case, short: "-i", description: "sorting and filtering are case insensitive"}
    - {name: Abbrev,    kind: flag, type: int, long: --abbrev, description: "use <n> digits to display object names"}
    - {name: Max count, kind: flag, type: int, long: --max-count, short: "-n", description: "maximum number of results per file"}
    - {name: Stat,      kind: flag, type: bool, long: --stat, description: "show diffstat instead of patch."}
    - {name: Format,    kind: flag, type: string, long: --format, description: "format to use for the output"}
    - {name: Trailer,   kind: flag, type: string, long: --trailer, repeatable: true, description: "add custom trailer(s)"}

    # -- positionals shared by many subcommands --
    - {name: Pathspec,   kind: positional, type: path,   required: false, variadic: true, description: "Files or directories to operate on."}
    - {name: Refspec,    kind: positional, type: string, required: false, variadic: true, description: "The remote ref(s) to fetch into."}
    - {name: Revision,   kind: positional, type: string, required: false, description: "The commit or revision to operate on."}
    - {name: Repository, kind: positional, type: string, required: false, description: "The repository to operate on."}

usage: git [<global options>] <command> [<args>]

options:
  [Git dir, Work tree, Namespace, Config env, Exec path, Bare, Paginate,
   No replace objects, No lazy fetch, No optional locks, No advice,
   Html path, Man path, Info path, Version, Help]

subcommands:
  - name: add
    description: Add file contents to the index.
    usage: git add [<options>] [--] <pathspec>...
    pool:
      options:
        - {name: Add interactive, kind: flag, type: bool, long: --interactive, short: "-i", description: "interactive picking"}
        - {name: Add edit, kind: flag, type: bool, long: --edit, short: "-e", description: "edit current diff and apply"}
        - {name: Add update, kind: flag, type: bool, long: --update, short: "-u", description: "update tracked files"}
        - {name: Add renormalize, kind: flag, type: bool, long: --renormalize, description: "renormalize EOL of tracked files (implies -u)"}
        - {name: Add intent to add, kind: flag, type: bool, long: --intent-to-add, short: "-N", description: "record only the fact that the path will be added later"}
        - {name: Add ignore removal, kind: flag, type: bool, long: --ignore-removal, description: "Update the index by adding new files that are unknown to the index and files modified in the working tree, but ignore files that have been removed from the working tree. This option is a no-op when no <pathspec> is used."}
        - {name: Add refresh, kind: flag, type: bool, long: --refresh, description: "don't add, only refresh the index"}
        - {name: Add ignore errors, kind: flag, type: bool, long: --ignore-errors, description: "just skip files which cannot be added because of errors"}
        - {name: Add ignore missing, kind: flag, type: bool, long: --ignore-missing, description: "This option can only be used together with --dry-run. By using this option the user can check if any of the given files would be ignored, no matter if they are already present in the work tree or not."}
        - {name: Add sparse, kind: flag, type: bool, long: --sparse, description: "allow updating entries outside of the sparse-checkout cone"}
        - {name: Add chmod, kind: flag, type: string, long: --chmod, description: "override the executable bit of the listed files"}
        - {name: Add pathspec file, kind: flag, type: string, long: --pathspec-from-file, description: "read pathspec from file"}
        - {name: Add pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul, description: "with --pathspec-from-file, pathspec elements are separated with NUL character"}
    options:
      [Dry run, Verbose, Add interactive, Patch, Add edit, Force, Add update,
       Add renormalize, Add intent to add, All, Add ignore removal, Add refresh,
       Add ignore errors, Add ignore missing, Add sparse, Add chmod,
       Add pathspec file, Add pathspec nul, Pathspec]

  - name: branch
    description: List, create, or delete branches.
    usage: git branch [<options>] <branch-name> [<start-point>]
    pool:
      options:
        - {name: Branch track, kind: flag, type: bool, long: --track, short: "-t", description: "set branch tracking configuration"}
        - {name: Branch set upstream, kind: flag, type: string, long: --set-upstream-to, short: "-u", description: "change the upstream info"}
        - {name: Branch unset upstream, kind: flag, type: bool, long: --unset-upstream, description: "Remove the upstream information for <branch-name>. If no branch is specified it defaults to the current branch."}
        - {name: Branch remotes, kind: flag, type: bool, long: --remotes, short: "-r", description: "act on remote-tracking branches"}
        - {name: Branch contains, kind: flag, type: string, long: --contains, description: "print only branches that contain the commit"}
        - {name: Branch no contains, kind: flag, type: string, long: --no-contains, description: "print only branches that don't contain the commit"}
        - {name: Branch delete, kind: flag, type: bool, long: --delete, short: "-d", description: "delete fully merged branch"}
        - {name: Branch delete force, kind: flag, type: bool, long: --force-delete, description: "Delete the branch even if it is not fully merged."}
        - {name: Branch move, kind: flag, type: bool, long: --move, short: "-m", description: "move/rename a branch and its reflog"}
        - {name: Branch copy, kind: flag, type: bool, long: --copy, short: "-c", description: "copy a branch and its reflog"}
        - {name: Branch list, kind: flag, type: bool, long: --list, short: "-l", description: "list branch names"}
        - {name: Branch show current, kind: flag, type: bool, long: --show-current, description: "show current branch name"}
        - {name: Branch create reflog, kind: flag, type: bool, long: --create-reflog, description: "create the branch's reflog"}
        - {name: Branch edit description, kind: flag, type: bool, long: --edit-description, description: "edit the description for the branch"}
        - {name: Branch merged, kind: flag, type: string, long: --merged, description: "print only branches that are merged"}
        - {name: Branch no merged, kind: flag, type: string, long: --no-merged, description: "print only branches that are not merged"}
        - {name: Branch column, kind: flag, type: enum, long: --column, values: [always, auto, never], description: "list branches in columns"}
        - {name: Branch sort, kind: flag, type: string, long: --sort, description: "field name to sort on"}
        - {name: Branch points at, kind: flag, type: string, long: --points-at, description: "print only branches of the object"}
        - {name: Branch name, kind: positional, type: string, required: false, description: "The branch name."}
        - {name: Branch start point, kind: positional, type: string, required: false, description: "The commit or branch to start the new branch at."}
    options:
      [Verbose, Quiet, Branch track, Branch set upstream, Branch unset upstream,
       Branch remotes, Branch contains, Branch no contains, Branch delete,
       Branch delete force, Branch move, Branch copy, Branch list,
       Branch show current, Branch create reflog, Branch edit description,
       Force, Branch merged, Branch no merged, Branch column, Branch sort,
       Branch points at, Ignore case, Recurse submodules, Format,
       Branch name, Branch start point]

  - name: checkout
    description: Switch branches or restore working tree files.
    usage: git checkout [<options>] <branch>
    pool:
      options:
        - {name: Checkout guess, kind: flag, type: bool, long: --guess, description: "second guess 'git checkout <no-such-branch>' (default)"}
        - {name: Checkout overlay, kind: flag, type: bool, long: --overlay, description: "use overlay mode (default)"}
        - {name: Checkout merge, kind: flag, type: bool, long: --merge, short: "-m", description: "perform a 3-way merge with the new branch"}
        - {name: Checkout conflict, kind: flag, type: enum, long: --conflict, values: [merge, diff3, zdiff3], description: "conflict style (merge, diff3, or zdiff3)"}
        - {name: Checkout detach, kind: flag, type: bool, long: --detach, short: "-d", description: "detach HEAD at named commit"}
        - {name: Checkout track, kind: flag, type: bool, long: --track, short: "-t", description: "set branch tracking configuration"}
        - {name: Checkout orphan, kind: flag, type: string, long: --orphan, description: "new unborn branch"}
        - {name: Checkout overwrite ignore, kind: flag, type: bool, long: --overwrite-ignore, description: "update ignored files (default)"}
        - {name: Checkout ignore other worktrees, kind: flag, type: bool, long: --ignore-other-worktrees, description: "do not check if another worktree is using this branch"}
        - {name: Checkout ours, kind: flag, type: bool, long: --ours, short: "-2", description: "checkout our version for unmerged files"}
        - {name: Checkout theirs, kind: flag, type: bool, long: --theirs, short: "-3", description: "checkout their version for unmerged files"}
        - {name: Checkout pathspec file, kind: flag, type: string, long: --pathspec-from-file, description: "read pathspec from file"}
        - {name: Checkout pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul, description: "with --pathspec-from-file, pathspec elements are separated with NUL character"}
        - {name: Checkout branch, kind: positional, type: string, required: false, description: "The branch or commit to check out."}
    options:
      [Quiet, Checkout guess, Checkout overlay, Recurse submodules, Progress,
       Checkout merge, Checkout conflict, Checkout detach, Checkout track, Force,
       Checkout orphan, Checkout overwrite ignore, Checkout ignore other worktrees,
       Checkout ours, Checkout theirs, Patch, Checkout pathspec file,
       Checkout pathspec nul, Checkout branch, Pathspec]

  - name: switch
    description: Switch branches.
    usage: git switch [<options>] [<branch>]
    pool:
      options:
        - {name: Switch create, kind: flag, type: string, long: --create, short: "-c", description: "create and switch to a new branch"}
        - {name: Switch force create, kind: flag, type: string, long: --force-create, short: "-C", description: "create/reset and switch to a branch"}
        - {name: Switch guess, kind: flag, type: bool, long: --guess, description: "second guess 'git switch <no-such-branch>'"}
        - {name: Switch discard, kind: flag, type: bool, long: --discard-changes, description: "throw away local modifications"}
        - {name: Switch merge, kind: flag, type: bool, long: --merge, short: "-m", description: "perform a 3-way merge with the new branch"}
        - {name: Switch conflict, kind: flag, type: enum, long: --conflict, values: [merge, diff3, zdiff3], description: "conflict style (merge, diff3, or zdiff3)"}
        - {name: Switch detach, kind: flag, type: bool, long: --detach, short: "-d", description: "detach HEAD at named commit"}
        - {name: Switch track, kind: flag, type: bool, long: --track, short: "-t", description: "set branch tracking configuration"}
        - {name: Switch orphan, kind: flag, type: string, long: --orphan, description: "new unborn branch"}
        - {name: Switch overwrite ignore, kind: flag, type: bool, long: --overwrite-ignore, description: "update ignored files (default)"}
        - {name: Switch ignore other worktrees, kind: flag, type: bool, long: --ignore-other-worktrees, description: "do not check if another worktree is using this branch"}
        - {name: Switch branch, kind: positional, type: string, required: false, description: "The branch to switch to."}
    options:
      [Switch create, Switch force create, Switch guess, Switch discard, Quiet,
       Recurse submodules, Progress, Switch merge, Switch conflict, Switch detach,
       Switch track, Force, Switch orphan, Switch overwrite ignore,
       Switch ignore other worktrees, Switch branch]

  - name: restore
    description: Restore working tree files.
    usage: git restore [<options>] [--source=<branch>] <file>...
    pool:
      options:
        - {name: Restore source, kind: flag, type: string, long: --source, short: "-s", description: "which tree-ish to checkout from"}
        - {name: Restore staged, kind: flag, type: bool, long: --staged, short: "-S", description: "restore the index"}
        - {name: Restore worktree, kind: flag, type: bool, long: --worktree, short: "-W", description: "restore the working tree (default)"}
        - {name: Restore ignore unmerged, kind: flag, type: bool, long: --ignore-unmerged, description: "ignore unmerged entries"}
        - {name: Restore overlay, kind: flag, type: bool, long: --overlay, description: "use overlay mode"}
        - {name: Restore merge, kind: flag, type: bool, long: --merge, short: "-m", description: "perform a 3-way merge with the new branch"}
        - {name: Restore conflict, kind: flag, type: enum, long: --conflict, values: [merge, diff3, zdiff3], description: "conflict style (merge, diff3, or zdiff3)"}
        - {name: Restore ours, kind: flag, type: bool, long: --ours, short: "-2", description: "checkout our version for unmerged files"}
        - {name: Restore theirs, kind: flag, type: bool, long: --theirs, short: "-3", description: "checkout their version for unmerged files"}
        - {name: Restore pathspec file, kind: flag, type: string, long: --pathspec-from-file, description: "read pathspec from file"}
        - {name: Restore pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul, description: "with --pathspec-from-file, pathspec elements are separated with NUL character"}
    options:
      [Restore source, Restore staged, Restore worktree, Restore ignore unmerged,
       Restore overlay, Quiet, Recurse submodules, Progress, Restore merge,
       Restore conflict, Restore ours, Restore theirs, Patch,
       Restore pathspec file, Restore pathspec nul, Pathspec]

  - name: clone
    description: Clone a repository into a new directory.
    usage: git clone [<options>] [--] <repo> [<dir>]
    pool:
      options:
        - {name: Clone local, kind: flag, type: bool, long: --local, short: "-l", description: "to clone from a local repository"}
        - {name: Clone no hardlinks, kind: flag, type: bool, long: --no-hardlinks, description: "don't use local hardlinks, always copy"}
        - {name: Clone shared, kind: flag, type: bool, long: --shared, short: "-s", description: "setup as shared repository"}
        - {name: Clone mirror, kind: flag, type: bool, long: --mirror, description: "create a mirror repository (implies --bare)"}
        - {name: Clone no checkout, kind: flag, type: bool, long: --no-checkout, description: "don't create a checkout"}
        - {name: Clone jobs, kind: flag, type: int, long: --jobs, short: "-j", description: "number of submodules cloned in parallel"}
        - {name: Clone template, kind: flag, type: string, long: --template, description: "directory from which templates will be used"}
        - {name: Clone reference, kind: flag, type: string, long: --reference, description: "reference repository"}
        - {name: Clone reference if able, kind: flag, type: string, long: --reference-if-able, description: "reference repository"}
        - {name: Clone dissociate, kind: flag, type: bool, long: --dissociate, description: "use --reference only while cloning"}
        - {name: Clone origin, kind: flag, type: string, long: --origin, short: "-o", description: "use <name> instead of 'origin' to track upstream"}
        - {name: Clone branch, kind: flag, type: string, long: --branch, short: "-b", description: "checkout <branch> instead of the remote's HEAD"}
        - {name: Clone revision, kind: flag, type: string, long: --revision, description: "Create a new repository, and fetch the history leading to the given revision <rev> (and nothing else), without making any remote-tracking branch, and without making any local branch, and detach HEAD to <rev>. The argument can be a ref name (e.g. refs/heads/main or refs/tags/v1.0) that peels down to a commit, or a hexadecimal object name. This option is incompatible with --branch and --mirror."}
        - {name: Clone upload pack, kind: flag, type: string, long: --upload-pack, short: "-u", description: "path to git-upload-pack on the remote"}
        - {name: Clone depth, kind: flag, type: int, long: --depth, description: "create a shallow clone of that depth"}
        - {name: Clone shallow since, kind: flag, type: string, long: --shallow-since, description: "create a shallow clone since a specific time"}
        - {name: Clone shallow exclude, kind: flag, type: string, long: --shallow-exclude, description: "deepen history of shallow clone, excluding ref"}
        - {name: Clone single branch, kind: flag, type: bool, long: --single-branch, description: "clone only one branch, HEAD or --branch"}
        - {name: Clone shallow submodules, kind: flag, type: bool, long: --shallow-submodules, description: "any cloned submodules will be shallow"}
        - {name: Clone separate git dir, kind: flag, type: string, long: --separate-git-dir, description: "separate git dir from working tree"}
        - {name: Clone config, kind: flag, type: string, long: --config, short: "-c", repeatable: true, description: "set config inside the new repository"}
        - {name: Clone server option, kind: flag, type: string, long: --server-option, repeatable: true, description: "option to transmit"}
        - {name: Clone ipv4, kind: flag, type: bool, long: --ipv4, short: "-4", description: "use IPv4 addresses only"}
        - {name: Clone ipv6, kind: flag, type: bool, long: --ipv6, short: "-6", description: "use IPv6 addresses only"}
        - {name: Clone filter, kind: flag, type: string, long: --filter, description: "object filtering"}
        - {name: Clone remote submodules, kind: flag, type: bool, long: --remote-submodules, description: "any cloned submodules will use their remote-tracking branch"}
        - {name: Clone sparse, kind: flag, type: bool, long: --sparse, description: "initialize sparse-checkout file to include only files at root"}
        - {name: Clone reject shallow, kind: flag, type: bool, long: --reject-shallow, description: "Fail if the source repository is shallow."}
        - {name: Clone source, kind: positional, type: string, required: true, description: "The repository to clone from."}
        - {name: Clone directory, kind: positional, type: path, required: false, description: "The directory to clone into."}
    options:
      [Verbose, Quiet, Progress, Clone reject shallow, Clone no checkout, Bare,
       Clone mirror, Clone local, Clone no hardlinks, Clone shared,
       Recurse submodules, Clone jobs, Clone template, Clone reference,
       Clone reference if able, Clone dissociate, Clone origin, Clone branch,
       Clone revision, Clone upload pack, Clone depth, Clone shallow since,
       Clone shallow exclude, Clone single branch, Tags, Clone shallow submodules,
       Clone separate git dir, Clone config, Clone server option, Clone ipv4,
       Clone ipv6, Clone filter, Clone remote submodules, Clone sparse,
       Clone source, Clone directory]

  - name: commit
    description: Record changes to the repository.
    usage: git commit [<options>] [--] [<pathspec>...]
    pool:
      options:
        - {name: Commit file, kind: flag, type: string, long: --file, short: "-F", description: "read message from file"}
        - {name: Commit author, kind: flag, type: string, long: --author, description: "override author for commit"}
        - {name: Commit date, kind: flag, type: string, long: --date, description: "override date for commit"}
        - {name: Commit message, kind: flag, type: string, long: --message, short: "-m", description: "commit message"}
        - {name: Commit reedit message, kind: flag, type: string, long: --reedit-message, short: "-c", description: "reuse and edit message from specified commit"}
        - {name: Commit reuse message, kind: flag, type: string, long: --reuse-message, short: "-C", description: "reuse message from specified commit"}
        - {name: Commit fixup, kind: flag, type: string, long: --fixup, description: "use autosquash formatted message to fixup or amend/reword specified commit"}
        - {name: Commit squash, kind: flag, type: string, long: --squash, description: "use autosquash formatted message to squash specified commit"}
        - {name: Commit reset author, kind: flag, type: bool, long: --reset-author, description: "the commit is authored by me now (used with -C/-c/--amend)"}
        - {name: Commit signoff, kind: flag, type: bool, long: --signoff, short: "-s", description: "add a Signed-off-by trailer"}
        - {name: Commit template, kind: flag, type: string, long: --template, short: "-t", description: "use specified template file"}
        - {name: Commit edit, kind: flag, type: bool, long: --edit, short: "-e", description: "force edit of commit"}
        - {name: Commit cleanup, kind: flag, type: enum, long: --cleanup, values: [strip, whitespace, verbatim, scissors, default], description: "Determine how the supplied commit message should be cleaned up before committing. The <mode> can be strip, whitespace, verbatim, scissors or default."}
        - {name: Commit status, kind: flag, type: bool, long: --status, description: "include status in commit message template"}
        - {name: Commit gpg sign, kind: flag, type: bool, long: --gpg-sign, short: "-S", description: "GPG sign commit"}
        - {name: Commit all, kind: flag, type: bool, long: --all, short: "-a", description: "commit all changed files"}
        - {name: Commit include, kind: flag, type: bool, long: --include, short: "-i", description: "add specified files to index for commit"}
        - {name: Commit interactive, kind: flag, type: bool, long: --interactive, description: "interactively add files"}
        - {name: Commit only, kind: flag, type: bool, long: --only, short: "-o", description: "commit only specified files"}
        - {name: Commit no verify, kind: flag, type: bool, long: --no-verify, short: "-n", description: "bypass pre-commit and commit-msg hooks"}
        - {name: Commit dry run, kind: flag, type: bool, long: --dry-run, description: "show what would be committed"}
        - {name: Commit short, kind: flag, type: bool, long: --short, description: "show status concisely"}
        - {name: Commit branch, kind: flag, type: bool, long: --branch, description: "show branch information"}
        - {name: Commit ahead behind, kind: flag, type: bool, long: --ahead-behind, description: "compute full ahead/behind values"}
        - {name: Commit porcelain, kind: flag, type: bool, long: --porcelain, description: "machine-readable output"}
        - {name: Commit long, kind: flag, type: bool, long: --long, description: "show status in long format (default)"}
        - {name: Commit null, kind: flag, type: bool, long: --null, short: "-z", description: "terminate entries with NUL"}
        - {name: Commit amend, kind: flag, type: bool, long: --amend, description: "amend previous commit"}
        - {name: Commit untracked files, kind: flag, type: enum, long: --untracked-files, values: [all, normal, no], description: "show untracked files, optional modes: all, normal, no. (Default: all)"}
        - {name: Commit pathspec file, kind: flag, type: string, long: --pathspec-from-file, description: "read pathspec from file"}
        - {name: Commit pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul, description: "with --pathspec-from-file, pathspec elements are separated with NUL character"}
    options:
      [Quiet, Verbose, Commit file, Commit author, Commit date, Commit message,
       Commit reedit message, Commit reuse message, Commit fixup, Commit squash,
       Commit reset author, Trailer, Commit signoff, Commit template, Commit edit,
       Commit cleanup, Commit status, Commit gpg sign, Commit all, Commit include,
       Commit interactive, Patch, Commit only, Commit no verify, Commit dry run,
       Commit short, Commit branch, Commit ahead behind, Commit porcelain,
       Commit long, Commit null, Commit amend, Commit untracked files,
       Commit pathspec file, Commit pathspec nul, Pathspec]

  - name: diff
    description: Show changes between commits, commit and working tree, etc.
    usage: git diff [<options>] [<commit>] [--] [<path>...]
    pool:
      options:
        - {name: Diff cached, kind: flag, type: bool, long: --cached, description: "only remove from the index"}
        - {name: Diff merge base, kind: flag, type: bool, long: --merge-base, description: "Compare using the merge base of the given commits."}
        - {name: Diff no index, kind: flag, type: bool, long: --no-index, description: "find in contents not managed by git"}
        - {name: Diff stat, kind: flag, type: bool, long: --stat, description: "show diffstat instead of patch."}
        - {name: Diff numstat, kind: flag, type: bool, long: --numstat, description: "show numeric diffstat instead of patch."}
        - {name: Diff name only, kind: flag, type: bool, long: --name-only, description: "show only names of changed files."}
        - {name: Diff name status, kind: flag, type: bool, long: --name-status, description: "Show only the name(s) and status of each changed file. See the description of the --diff-filter option on what the status letters mean. Just like --name-only the file names are often encoded in UTF-8."}
        - {name: Diff full index, kind: flag, type: bool, long: --full-index, description: "show full object name on index lines."}
        - {name: Diff patch with raw, kind: flag, type: bool, long: --patch-with-raw, description: "Synonym for -p --raw."}
        - {name: Diff patch with stat, kind: flag, type: bool, long: --patch-with-stat, description: "Synonym for -p --stat."}
        - {name: Diff raw, kind: flag, type: bool, long: --raw, short: "-z", description: "Generate the diff in raw format."}
        - {name: Diff rewrites, kind: flag, type: bool, long: --break-rewrites, short: "-B", description: "Break complete rewrite changes into pairs of delete and create. This serves two purposes:"}
        - {name: Diff renames, kind: flag, type: bool, long: --find-renames, short: "-M", description: "Detect renames. If <n> is specified, it is a threshold on the similarity index (i.e. amount of addition/deletions compared to the file’s size). For example, -M90% means Git should consider a delete/add pair to be a rename if more than 90% of the file hasn’t changed. Without a % sign, the number is to be read as a fraction, with a decimal point before it. I.e., -M5 becomes 0.5, and is thus the same as -M50%. Similarly, -M05 is the same as -M5%. To limit detection to exact renames, use -M100%. The default similarity index is 50%."}
        - {name: Diff copies, kind: flag, type: bool, long: --find-copies, short: "-C", description: "Detect copies as well as renames. See also --find-copies-harder. If <n> is specified, it has the same meaning as for -M<n>."}
        - {name: Diff find copies harder, kind: flag, type: bool, long: --find-copies-harder, description: "For performance reasons, by default, -C option finds copies only if the original file of the copy was modified in the same changeset. This flag makes the command inspect unmodified files as candidates for the source of copy. This is a very expensive operation for large projects, so use it with caution. Giving more than one -C option has the same effect."}
        - {name: Diff pickaxe all, kind: flag, type: bool, long: --pickaxe-all, description: "When -S or -G finds a change, show all the changes in that changeset, not just the files that contain the change in <string>."}
        - {name: Diff text, kind: flag, type: bool, long: --text, short: "-a", description: "Treat all files as text."}
    options:
      [Patch, Diff cached, Diff merge base, Diff no index, Diff stat, Diff numstat,
       Diff name only, Diff name status, Diff full index, Abbrev, Diff patch with raw,
       Diff patch with stat, Diff raw, Diff rewrites, Diff renames, Diff copies,
       Diff find copies harder, Diff pickaxe all, Diff text, Revision, Pathspec]

  - name: fetch
    description: Download objects and refs from another repository.
    usage: git fetch [<options>] [<repository> [<refspec>...]]
    pool:
      options:
        - {name: Fetch append, kind: flag, type: bool, long: --append, short: "-a", description: "append to .git/FETCH_HEAD instead of overwriting"}
        - {name: Fetch atomic, kind: flag, type: bool, long: --atomic, description: "use atomic transaction to update references"}
        - {name: Fetch upload pack, kind: flag, type: string, long: --upload-pack, description: "path to upload pack on remote end"}
        - {name: Fetch multiple, kind: flag, type: bool, long: --multiple, short: "-m", description: "fetch from multiple remotes"}
        - {name: Fetch no tags, kind: flag, type: bool, long: --no-tags, short: "-n", description: "fetch all tags and associated objects"}
        - {name: Fetch jobs, kind: flag, type: int, long: --jobs, short: "-j", description: "number of submodules fetched in parallel"}
        - {name: Fetch prefetch, kind: flag, type: bool, long: --prefetch, description: "modify the refspec to place all refs within refs/prefetch/"}
        - {name: Fetch prune tags, kind: flag, type: bool, long: --prune-tags, short: "-P", description: "Before fetching, remove any local tags that no longer exist on the remote if --prune is enabled. This option should be used more carefully, unlike --prune it will remove any local references (local tags) that have been created. This option is a shorthand for providing the explicit tag refspec along with --prune, see the discussion about that in its documentation."}
        - {name: Fetch porcelain, kind: flag, type: bool, long: --porcelain, description: "machine-readable output"}
        - {name: Fetch write head, kind: flag, type: bool, long: --write-fetch-head, description: "write fetched references to the FETCH_HEAD file"}
        - {name: Fetch keep, kind: flag, type: bool, long: --keep, short: "-k", description: "keep downloaded pack"}
        - {name: Fetch update head ok, kind: flag, type: bool, long: --update-head-ok, short: "-u", description: "allow updating of HEAD ref"}
        - {name: Fetch depth, kind: flag, type: int, long: --depth, description: "deepen history of shallow clone"}
        - {name: Fetch shallow since, kind: flag, type: string, long: --shallow-since, description: "deepen history of shallow repository based on time"}
        - {name: Fetch shallow exclude, kind: flag, type: string, long: --shallow-exclude, description: "deepen history of shallow clone, excluding ref"}
        - {name: Fetch deepen, kind: flag, type: int, long: --deepen, description: "deepen history of shallow clone"}
        - {name: Fetch unshallow, kind: flag, type: bool, long: --unshallow, description: "convert to a complete repository"}
        - {name: Fetch refetch, kind: flag, type: bool, long: --refetch, description: "re-fetch without negotiating common commits"}
        - {name: Fetch update shallow, kind: flag, type: bool, long: --update-shallow, description: "By default when fetching from a shallow repository, git fetch refuses refs that require updating .git/shallow. This option updates .git/shallow and accepts such refs."}
        - {name: Fetch refmap, kind: flag, type: string, long: --refmap, description: "specify fetch refmap"}
        - {name: Fetch server option, kind: flag, type: string, long: --server-option, short: "-o", repeatable: true, description: "option to transmit"}
        - {name: Fetch ipv4, kind: flag, type: bool, long: --ipv4, short: "-4", description: "use IPv4 addresses only"}
        - {name: Fetch ipv6, kind: flag, type: bool, long: --ipv6, short: "-6", description: "use IPv6 addresses only"}
        - {name: Fetch negotiation tip, kind: flag, type: string, long: --negotiation-tip, repeatable: true, description: "report that we have only objects reachable from this object"}
        - {name: Fetch negotiate only, kind: flag, type: bool, long: --negotiate-only, description: "Do not fetch anything from the server, and instead print the ancestors of the provided --negotiation-tip=* arguments, which we have in common with the server."}
        - {name: Fetch filter, kind: flag, type: string, long: --filter, description: "object filtering"}
        - {name: Fetch auto maintenance, kind: flag, type: bool, long: --auto-maintenance, description: "run 'maintenance --auto' after fetching"}
        - {name: Fetch show forced, kind: flag, type: bool, long: --show-forced-updates, description: "check for forced-updates on all updated branches"}
        - {name: Fetch commit graph, kind: flag, type: bool, long: --write-commit-graph, description: "write the commit-graph after fetching"}
        - {name: Fetch stdin, kind: flag, type: bool, long: --stdin, description: "accept refspecs from stdin"}
    options:
      [Verbose, Quiet, All, Set upstream, Fetch append, Fetch atomic,
       Fetch upload pack, Force, Fetch multiple, Tags, Fetch no tags, Fetch jobs,
       Fetch prefetch, Prune, Fetch prune tags, Recurse submodules, Dry run,
       Fetch porcelain, Fetch write head, Fetch keep, Fetch update head ok,
       Progress, Fetch depth, Fetch shallow since, Fetch shallow exclude,
       Fetch deepen, Fetch unshallow, Fetch refetch, Fetch update shallow,
       Fetch refmap, Fetch server option, Fetch ipv4, Fetch ipv6,
       Fetch negotiation tip, Fetch negotiate only, Fetch filter,
       Fetch auto maintenance, Fetch show forced, Fetch commit graph, Fetch stdin,
       Repository, Refspec]

  - name: log
    description: Show commit logs.
    usage: git log [<options>] [<revision-range>] [[--] <path>...]
    pool:
      options:
        - {name: Log oneline, kind: flag, type: bool, long: --oneline, description: "This is a shorthand for \"--pretty=oneline --abbrev-commit\" used together."}
        - {name: Log graph, kind: flag, type: bool, long: --graph, description: "Draw a text-based graphical representation of the commit history on the left hand side of the output. This may cause extra lines to be printed in between commits, in order for the graph history to be drawn properly. Cannot be combined with --no-walk."}
        - {name: Log decorate, kind: flag, type: bool, long: --decorate, description: "Print out the ref names of any commits that are shown. If short is specified, the ref name prefixes refs/heads/, refs/tags/ and refs/remotes/ will not be printed. If full is specified, the full ref name (including prefix) will be printed. If auto is specified, then if the output is going to a terminal, the ref names are shown as if short were given, otherwise no ref names are shown. The option --decorate is short-hand for --decorate=short. Default to configuration value of log.decorate if configured, otherwise, auto."}
        - {name: Log source, kind: flag, type: bool, long: --source, description: "show source"}
        - {name: Log use mailmap, kind: flag, type: bool, long: --use-mailmap, description: "use mail map file"}
        - {name: Log skip, kind: flag, type: int, long: --skip, description: "Skip number commits before starting to show the commit output."}
        - {name: Log since, kind: flag, type: string, long: --since, description: "Show commits more recent than a specific date."}
        - {name: Log until, kind: flag, type: string, long: --until, description: "Show commits older than a specific date."}
        - {name: Log author, kind: flag, type: string, long: --author, description: "Limit the commits output to ones with author/committer header lines that match the specified pattern (regular expression). With more than one --author=<pattern>, commits whose author matches any of the given patterns are chosen (similarly for multiple --committer=<pattern>)."}
        - {name: Log committer, kind: flag, type: string, long: --committer, description: "Limit the commits output to ones with author/committer header lines that match the specified pattern (regular expression). With more than one --author=<pattern>, commits whose author matches any of the given patterns are chosen (similarly for multiple --committer=<pattern>)."}
        - {name: Log grep, kind: flag, type: string, long: --grep, description: "Limit the commits output to ones with a log message that matches the specified pattern (regular expression). With more than one --grep=<pattern>, commits whose message matches any of the given patterns are chosen (but see --all-match)."}
        - {name: Log regexp ignore case, kind: flag, type: bool, long: --regexp-ignore-case, short: "-i", description: "Match the regular expression limiting patterns without regard to letter case."}
        - {name: Log pretty, kind: flag, type: string, long: --pretty, description: "Pretty-print the contents of the commit logs in a given format, where <format> can be one of oneline, short, medium, full, fuller, reference, email, raw, format:<string> and tformat:<string>. When <format> is none of the above, and has %placeholder in it, it acts as if --pretty=tformat:<format> were given."}
        - {name: Log format, kind: flag, type: string, long: --format, description: "Pretty-print the contents of the commit logs in a given format, where <format> can be one of oneline, short, medium, full, fuller, reference, email, raw, format:<string> and tformat:<string>. When <format> is none of the above, and has %placeholder in it, it acts as if --pretty=tformat:<format> were given."}
        - {name: Log abbrev commit, kind: flag, type: bool, long: --abbrev-commit, description: "Instead of showing the full 40-byte hexadecimal commit object name, show a prefix that names the object uniquely. \"--abbrev=<n>\" (which also modifies diff output, if it is displayed) option can be used to specify the minimum length of the prefix."}
        - {name: Log no merges, kind: flag, type: bool, long: --no-merges, description: "Do not print commits with more than one parent. This is exactly the same as --max-parents=1."}
        - {name: Log merges, kind: flag, type: bool, long: --merges, description: "Print only merge commits. This is exactly the same as --min-parents=2."}
        - {name: Log first parent, kind: flag, type: bool, long: --first-parent, description: "When finding commits to include, follow only the first parent commit upon seeing a merge commit. This option can give a better overview when viewing the evolution of a particular topic branch, because merges into a topic branch tend to be only about adjusting to updated upstream from time to time, and this option allows you to ignore the individual commits brought in to your history by such a merge."}
        - {name: Log reverse, kind: flag, type: bool, long: --reverse, description: "Output the commits chosen to be shown (see Commit Limiting section above) in reverse order. Cannot be combined with --walk-reflogs."}
        - {name: Log follow, kind: flag, type: bool, long: --follow, description: "Continue listing the history of a file beyond renames (works only for a single file)."}
        - {name: Log pickaxe, kind: flag, type: string, long: --pickaxe-string, short: "-S", description: "Limit to commits that change the number of occurrences of the given string."}
        - {name: Log pickaxe regex, kind: flag, type: string, long: --pickaxe-regex, short: "-G", description: "Treat the <string> given to -S as an extended POSIX regular expression to match."}
        - {name: Log name only, kind: flag, type: bool, long: --name-only, description: "Show only the name of each changed file in the post-image tree. The file names are often encoded in UTF-8. For more information see the discussion about encoding in the git-log(1) manual page."}
        - {name: Log name status, kind: flag, type: bool, long: --name-status, description: "Show only the name(s) and status of each changed file. See the description of the --diff-filter option on what the status letters mean. Just like --name-only the file names are often encoded in UTF-8."}
    options:
      [Quiet, Log oneline, Log graph, Log decorate, Log source, Log use mailmap,
       Max count, Log skip, Log since, Log until, Log author, Log committer,
       Log grep, Log regexp ignore case, Log pretty, Log format, Abbrev,
       Log abbrev commit, Stat, Patch, Log name only, Log name status,
       Log no merges, Log merges, Log first parent, Log reverse, Log follow,
       Log pickaxe, Log pickaxe regex, All, Revision, Pathspec]

  - name: merge
    description: Join two or more development histories together.
    usage: git merge [<options>] [<commit>...]
    pool:
      options:
        - {name: Merge no stat, kind: flag, type: bool, long: --no-stat, short: "-n", description: "show a diffstat at the end of the merge"}
        - {name: Merge squash, kind: flag, type: bool, long: --squash, description: "create a single commit instead of doing a merge"}
        - {name: Merge log, kind: flag, type: bool, long: --log, description: "add (at most <n>) entries from shortlog to merge commit message"}
        - {name: Merge commit, kind: flag, type: bool, long: --commit, description: "perform a commit if the merge succeeds (default)"}
        - {name: Merge edit, kind: flag, type: bool, long: --edit, short: "-e", description: "edit message before committing"}
        - {name: Merge cleanup, kind: flag, type: enum, long: --cleanup, values: [strip, whitespace, verbatim, scissors, default], description: "This option determines how the merge message will be cleaned up before committing. See git-commit(1) for more details. In addition, if the <mode> is given a value of scissors, scissors will be appended to MERGE_MSG before being passed on to the commit machinery in the case of a merge conflict."}
        - {name: Merge ff, kind: flag, type: bool, long: --ff, description: "allow fast-forward (default)"}
        - {name: Merge ff only, kind: flag, type: bool, long: --ff-only, description: "abort if fast-forward is not possible"}
        - {name: Merge rerere autoupdate, kind: flag, type: bool, long: --rerere-autoupdate, description: "update the index with reused conflict resolution if possible"}
        - {name: Merge verify signatures, kind: flag, type: bool, long: --verify-signatures, description: "verify that the named commit has a valid GPG signature"}
        - {name: Merge strategy, kind: flag, type: string, long: --strategy, short: "-s", description: "merge strategy to use"}
        - {name: Merge strategy option, kind: flag, type: string, long: --strategy-option, short: "-X", repeatable: true, description: "option for selected merge strategy"}
        - {name: Merge message, kind: flag, type: string, long: --message, short: "-m", description: "merge commit message (for a non-fast-forward merge)"}
        - {name: Merge file, kind: flag, type: string, long: --file, short: "-F", description: "read message from file"}
        - {name: Merge into name, kind: flag, type: string, long: --into-name, description: "use <name> instead of the real target"}
        - {name: Merge abort, kind: flag, type: bool, long: --abort, description: "abort the current in-progress merge"}
        - {name: Merge quit, kind: flag, type: bool, long: --quit, description: "--abort but leave index and working tree alone"}
        - {name: Merge continue, kind: flag, type: bool, long: --continue, description: "continue the current in-progress merge"}
        - {name: Merge allow unrelated, kind: flag, type: bool, long: --allow-unrelated-histories, description: "allow merging unrelated histories"}
        - {name: Merge gpg sign, kind: flag, type: bool, long: --gpg-sign, short: "-S", description: "GPG sign commit"}
        - {name: Merge autostash, kind: flag, type: bool, long: --autostash, description: "automatically stash/stash pop before and after"}
        - {name: Merge overwrite ignore, kind: flag, type: bool, long: --overwrite-ignore, description: "update ignored files (default)"}
        - {name: Merge signoff, kind: flag, type: bool, long: --signoff, description: "add a Signed-off-by trailer"}
        - {name: Merge no verify, kind: flag, type: bool, long: --no-verify, description: "bypass pre-merge-commit and commit-msg hooks"}
        - {name: Merge commitish, kind: positional, type: string, required: false, description: "The commit to merge into the current branch."}
    options:
      [Merge no stat, Stat, Merge squash, Merge log, Merge commit, Merge edit,
       Merge cleanup, Merge ff, Merge ff only, Merge rerere autoupdate,
       Merge verify signatures, Merge strategy, Merge strategy option,
       Merge message, Merge file, Merge into name, Verbose, Quiet, Merge abort,
       Merge quit, Merge continue, Merge allow unrelated, Progress,
       Merge gpg sign, Merge autostash, Merge overwrite ignore, Merge signoff,
       Merge no verify, Merge commitish]

  - name: mv
    description: Move or rename a file, a directory, or a symlink.
    usage: git mv [<options>] <source>... <destination>
    pool:
      options:
