       Push force if includes, Recurse submodules, Push thin, Push receive pack,
       Set upstream, Progress, Prune, Push no verify, Push follow tags,
       Push signed, Push atomic, Push option, Push ipv4, Push ipv6,
       Repository, Refspec]

  - name: rebase
    description: Reapply commits on top of another base tip.
    usage: git rebase [-i] [<options>] [<upstream> [<branch>]]
    pool:
      options:
        - {name: Rebase onto, kind: flag, type: string, long: --onto, description: "rebase onto given branch instead of upstream"}
        - {name: Rebase keep base, kind: flag, type: bool, long: --keep-base, description: "use the merge-base of upstream and branch as the current base"}
        - {name: Rebase interactive, kind: flag, type: bool, long: --interactive, short: "-i", description: "let the user edit the list of commits to rebase"}
        - {name: Rebase apply, kind: flag, type: bool, long: --apply, description: "use apply strategies to rebase"}
        - {name: Rebase merge, kind: flag, type: bool, long: --merge, short: "-m", description: "use merging strategies to rebase"}
        - {name: Rebase continue, kind: flag, type: bool, long: --continue, description: "continue"}
        - {name: Rebase skip, kind: flag, type: bool, long: --skip, description: "skip current patch and continue"}
        - {name: Rebase abort, kind: flag, type: bool, long: --abort, description: "abort and check out the original branch"}
        - {name: Rebase quit, kind: flag, type: bool, long: --quit, description: "abort but keep HEAD where it is"}
        - {name: Rebase edit todo, kind: flag, type: bool, long: --edit-todo, description: "edit the todo list during an interactive rebase"}
        - {name: Rebase show patch, kind: flag, type: bool, long: --show-current-patch, description: "show the patch file being applied or merged"}
        - {name: Rebase root, kind: flag, type: bool, long: --root, description: "rebase all reachable commits up to the root(s)"}
        - {name: Rebase autosquash, kind: flag, type: bool, long: --autosquash, description: "move commits that begin with squash!/fixup! under -i"}
        - {name: Rebase update refs, kind: flag, type: bool, long: --update-refs, description: "update branches that point to commits that are being rebased"}
        - {name: Rebase autostash, kind: flag, type: bool, long: --autostash, description: "automatically stash/stash pop before and after"}
        - {name: Rebase committer date, kind: flag, type: bool, long: --committer-date-is-author-date, description: "make committer date match author date"}
        - {name: Rebase reset author date, kind: flag, type: bool, long: --reset-author-date, description: "ignore author date and use current date"}
        - {name: Rebase ignore whitespace, kind: flag, type: bool, long: --ignore-whitespace, description: "ignore changes in whitespace"}
        - {name: Rebase whitespace, kind: flag, type: string, long: --whitespace, description: "passed to 'git apply'"}
        - {name: Rebase force, kind: flag, type: bool, long: --force-rebase, short: "-f", description: "cherry-pick all commits, even if unchanged"}
        - {name: Rebase no ff, kind: flag, type: bool, long: --no-ff, description: "cherry-pick all commits, even if unchanged"}
        - {name: Rebase ff, kind: flag, type: bool, long: --ff, description: "opposite of --no-ff"}
        - {name: Rebase empty, kind: flag, type: enum, long: --empty, values: [drop, keep, stop], description: "how to handle commits that become empty"}
        - {name: Rebase exec, kind: flag, type: string, long: --exec, short: "-x", repeatable: true, description: "add exec lines after each commit of the editable list"}
        - {name: Rebase merges, kind: flag, type: bool, long: --rebase-merges, short: "-r", description: "try to rebase merges instead of skipping them"}
        - {name: Rebase fork point, kind: flag, type: bool, long: --fork-point, description: "use 'merge-base --fork-point' to refine upstream"}
        - {name: Rebase strategy, kind: flag, type: string, long: --strategy, short: "-s", description: "use the given merge strategy"}
        - {name: Rebase strategy option, kind: flag, type: string, long: --strategy-option, short: "-X", repeatable: true, description: "pass the argument through to the merge strategy"}
        - {name: Rebase reschedule, kind: flag, type: bool, long: --reschedule-failed-exec, description: "automatically re-schedule any `exec` that fails"}
        - {name: Rebase reapply, kind: flag, type: bool, long: --reapply-cherry-picks, description: "apply all changes, even those already present upstream"}
        - {name: Rebase signoff, kind: flag, type: bool, long: --signoff, description: "add a Signed-off-by trailer to each commit"}
        - {name: Rebase gpg sign, kind: flag, type: bool, long: --gpg-sign, short: "-S", description: "GPG-sign commits"}
        - {name: Rebase upstream, kind: positional, type: string, required: false, description: "The upstream branch to rebase onto."}
        - {name: Rebase branch, kind: positional, type: string, required: false, description: "The branch to rebase."}
    options:
      [Rebase onto, Rebase keep base, Rebase interactive, Rebase apply,
       Rebase merge, Rebase continue, Rebase skip, Rebase abort, Rebase quit,
       Rebase edit todo, Rebase show patch, Rebase root, Rebase autosquash,
       Rebase update refs, Rebase autostash, Rebase committer date,
       Rebase reset author date, Rebase ignore whitespace, Rebase whitespace,
       Rebase force, Rebase no ff, Rebase ff, Rebase empty, Rebase exec,
       Rebase merges, Rebase fork point, Rebase strategy, Rebase strategy option,
       Rebase reschedule, Rebase reapply, Rebase signoff, Rebase gpg sign,
       Quiet, Verbose, Progress, Rebase upstream, Rebase branch]

  - name: reset
    description: Reset current HEAD to the specified state.
    usage: git reset [--mixed | --soft | --hard | --merge | --keep] [<commit>]
    pool:
      options:
        - {name: Reset mixed, kind: flag, type: bool, long: --mixed, conflicts: [Reset soft, Reset hard, Reset merge, Reset keep], description: "reset HEAD and index"}
        - {name: Reset soft, kind: flag, type: bool, long: --soft, conflicts: [Reset mixed, Reset hard, Reset merge, Reset keep], description: "reset only HEAD"}
        - {name: Reset hard, kind: flag, type: bool, long: --hard, conflicts: [Reset mixed, Reset soft, Reset merge, Reset keep], description: "reset HEAD, index and working tree"}
        - {name: Reset merge, kind: flag, type: bool, long: --merge, conflicts: [Reset mixed, Reset soft, Reset hard, Reset keep], description: "reset HEAD, index and working tree"}
        - {name: Reset keep, kind: flag, type: bool, long: --keep, conflicts: [Reset mixed, Reset soft, Reset hard, Reset merge], description: "reset HEAD but keep local changes"}
        - {name: Reset refresh, kind: flag, type: bool, long: --refresh, description: "opposite of --no-refresh"}
        - {name: Reset no refresh, kind: flag, type: bool, long: --no-refresh, description: "skip refreshing the index after reset"}
        - {name: Reset intent to add, kind: flag, type: bool, long: --intent-to-add, short: "-N", description: "record only the fact that removed paths will be added later"}
        - {name: Reset pathspec file, kind: flag, type: string, long: --pathspec-from-file, description: "read pathspec from file"}
        - {name: Reset pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul, description: "with --pathspec-from-file, pathspec elements are separated with NUL character"}
    options:
      [Quiet, Reset mixed, Reset soft, Reset hard, Reset merge, Reset keep,
       Reset refresh, Reset no refresh, Recurse submodules, Patch,
       Reset intent to add, Reset pathspec file, Reset pathspec nul,
       Revision, Pathspec]

  - name: rm
    description: Remove files from the working tree and from the index.
    usage: git rm [<options>] [--] <pathspec>...
    pool:
      options:
        - {name: Rm cached, kind: flag, type: bool, long: --cached, description: "only remove from the index"}
        - {name: Rm recursive, kind: flag, type: bool, long: --recursive, short: "-r", description: "alias of --recurse-submodules"}
        - {name: Rm ignore unmatch, kind: flag, type: bool, long: --ignore-unmatch, description: "Exit with a zero status even if no files matched."}
        - {name: Rm sparse, kind: flag, type: bool, long: --sparse, description: "allow updating entries outside of the sparse-checkout cone"}
        - {name: Rm pathspec file, kind: flag, type: string, long: --pathspec-from-file, description: "read pathspec from file"}
        - {name: Rm pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul, description: "with --pathspec-from-file, pathspec elements are separated with NUL character"}
    options:
      [Dry run, Quiet, Rm cached, Force, Rm recursive, Rm ignore unmatch,
       Rm sparse, Rm pathspec file, Rm pathspec nul, Pathspec]

  - name: show
    description: Show various types of objects.
    usage: git show [<options>] <object>...
    pool:
      options:
        - {name: Show source, kind: flag, type: bool, long: --source, description: "show source"}
        - {name: Show use mailmap, kind: flag, type: bool, long: --use-mailmap, description: "use mail map file"}
        - {name: Show decorate, kind: flag, type: bool, long: --decorate, description: "Print out the ref names of any commits that are shown. If short is specified, the ref name prefixes refs/heads/, refs/tags/ and refs/remotes/ will not be printed. If full is specified, the full ref name (including prefix) will be printed. If auto is specified, then if the output is going to a terminal, the ref names are shown as if short were given, otherwise no ref names are shown. The option --decorate is short-hand for --decorate=short. Default to configuration value of log.decorate if configured, otherwise, auto."}
        - {name: Show abbrev commit, kind: flag, type: bool, long: --abbrev-commit, description: "Instead of showing the full 40-byte hexadecimal commit object name, show a prefix that names the object uniquely. \"--abbrev=<n>\" (which also modifies diff output, if it is displayed) option can be used to specify the minimum length of the prefix."}
        - {name: Show pretty, kind: flag, type: string, long: --pretty, description: "Pretty-print the contents of the commit logs in a given format, where <format> can be one of oneline, short, medium, full, fuller, reference, email, raw, format:<string> and tformat:<string>. When <format> is none of the above, and has %placeholder in it, it acts as if --pretty=tformat:<format> were given."}
        - {name: Show format, kind: flag, type: string, long: --format, description: "Pretty-print the contents of the commit logs in a given format, where <format> can be one of oneline, short, medium, full, fuller, reference, email, raw, format:<string> and tformat:<string>. When <format> is none of the above, and has %placeholder in it, it acts as if --pretty=tformat:<format> were given."}
        - {name: Show objects, kind: positional, type: string, required: true, variadic: true, description: "The objects to show."}
    options:
      [Quiet, Show source, Show use mailmap, Show decorate, Show abbrev commit,
       Show pretty, Show format, Stat, Patch, Abbrev, Show objects]

