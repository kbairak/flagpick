        - {name: Push signed, kind: flag, type: enum, long: --signed, values: [yes, no, if-asked], description: "GPG sign the push"}
        - {name: Push atomic, kind: flag, type: bool, long: --atomic, description: "request atomic transaction on remote side"}
        - {name: Push option, kind: flag, type: string, long: --push-option, short: "-o", repeatable: true, description: "option to transmit"}
        - {name: Push ipv4, kind: flag, type: bool, long: --ipv4, short: "-4", description: "use IPv4 addresses only"}
        - {name: Push ipv6, kind: flag, type: bool, long: --ipv6, short: "-6", description: "use IPv6 addresses only"}
