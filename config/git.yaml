        - {name: Pull append, kind: flag, type: bool, long: --append, short: "-a", description: "append to .git/FETCH_HEAD instead of overwriting"}
        - {name: Pull upload pack, kind: flag, type: string, long: --upload-pack, description: "path to upload pack on remote end"}
        - {name: Pull jobs, kind: flag, type: int, long: --jobs, short: "-j", description: "Number of parallel children to be used for all forms of fetching."}
        - {name: Pull depth, kind: flag, type: int, long: --depth, description: "deepen history of shallow clone"}
        - {name: Pull keep, kind: flag, type: bool, long: --keep, short: "-k", description: "keep downloaded pack"}
        - {name: Pull server option, kind: flag, type: string, long: --server-option, short: "-o", repeatable: true, description: "option to transmit"}
        - {name: Pull ipv4, kind: flag, type: bool, long: --ipv4, short: "-4", description: "use IPv4 addresses only"}
        - {name: Pull ipv6, kind: flag, type: bool, long: --ipv6, short: "-6", description: "use IPv6 addresses only"}
    options:
      [Verbose, Quiet, Progress, Recurse submodules, All, Set upstream,
       Pull rebase, Pull no stat, Stat, Pull log, Pull signoff, Pull squash,
       Pull commit, Pull edit, Pull cleanup, Pull ff, Pull ff only, Tags, Prune,
       Pull verify signatures, Pull autostash, Pull strategy,
       Pull strategy option, Pull gpg sign, Pull allow unrelated, Pull append,
       Pull upload pack, Pull jobs, Pull depth, Pull keep, Pull server option,
       Pull ipv4, Pull ipv6, Dry run, Repository, Refspec]

  - name: push
    description: Update remote refs along with associated objects.
    usage: git push [<options>] [<repository> [<refspec>...]]
    pool:
      options:
        - {name: Push repo, kind: flag, type: string, long: --repo, description: "repository"}
        - {name: Push branches, kind: flag, type: bool, long: --branches, description: "alias of --all"}
        - {name: Push mirror, kind: flag, type: bool, long: --mirror, description: "mirror all refs"}
        - {name: Push delete, kind: flag, type: bool, long: --delete, short: "-d", description: "delete refs"}
