  - name: remote
    description: Manage the set of repositories ("remotes") whose branches you track.
    usage: git remote [-v] <subcommand>
    options: [Verbose]
    subcommands:
      - name: add
        description: Add a remote named <name> for the repository at <url>.
        usage: git remote add [<options>] <name> <url>
        pool:
          options:
            - {name: Remote add track, kind: flag, type: string, long: --track, short: "-t", repeatable: true}
            - {name: Remote add fetch, kind: flag, type: bool, long: --fetch, short: "-f"}
            - {name: Remote add no tags, kind: flag, type: bool, long: --no-tags}
            - {name: Remote add mirror, kind: flag, type: enum, long: --mirror, values: [fetch, push]}
            - {name: Remote name, kind: positional, type: string, required: true}
            - {name: Remote url, kind: positional, type: string, required: true}
        options: [Tags, Remote add track, Remote add fetch, Remote add no tags, Remote add mirror, Remote name, Remote url]

      - name: remove
        description: Remove the remote named <name>.
        usage: git remote remove <name>
        pool:
          options:
            - {name: Remote remove name, kind: positional, type: string, required: true}
        options: [Remote remove name]

      - name: rename
        description: Rename the remote named <old> to <new>.
        usage: git remote rename <old> <new>
        pool:
          options:
            - {name: Remote old name, kind: positional, type: string, required: true}
            - {name: Remote new name, kind: positional, type: string, required: true}
        options: [Progress, Remote old name, Remote new name]

      - name: show
        description: Give some information about the remote <name>.
        usage: git remote show [-n] <name>
        pool:
          options:
            - {name: Remote show name, kind: positional, type: string, required: true}
        options: [Verbose, Remote show name]

      - name: prune
        description: Delete stale references associated with <name>.
        usage: git remote prune [-n] <name>
        pool:
          options:
            - {name: Remote prune name, kind: positional, type: string, required: true}
        options: [Dry run, Remote prune name]

      - name: update
        description: Fetch updates for remotes or remote groups.
        usage: git remote update [-p] [<remote>...]
        pool:
          options:
            - {name: Remote update names, kind: positional, type: string, required: false, variadic: true}
        options: [Prune, Remote update names]

      - name: set-head
        description: Set or delete the default branch for a remote.
        usage: git remote set-head <name> (-a | -d | <branch>)
        pool:
          options:
            - {name: Remote set-head auto, kind: flag, type: bool, long: --auto, short: "-a"}
            - {name: Remote set-head delete, kind: flag, type: bool, long: --delete, short: "-d"}
            - {name: Remote set-head name, kind: positional, type: string, required: true}
            - {name: Remote set-head branch, kind: positional, type: string, required: false}
        options: [Remote set-head auto, Remote set-head delete, Remote set-head name, Remote set-head branch]

      - name: set-url
        description: Change the URL of a remote.
        usage: git remote set-url [<options>] <name> <newurl> [<oldurl>]
        pool:
          options:
            - {name: Remote set-url push, kind: flag, type: bool, long: --push}
            - {name: Remote set-url add, kind: flag, type: bool, long: --add}
            - {name: Remote set-url delete, kind: flag, type: bool, long: --delete}
            - {name: Remote set-url name, kind: positional, type: string, required: true}
            - {name: Remote set-url new url, kind: positional, type: string, required: true}
            - {name: Remote set-url old url, kind: positional, type: string, required: false}
        options: [Remote set-url push, Remote set-url add, Remote set-url delete, Remote set-url name, Remote set-url new url, Remote set-url old url]

      - name: get-url
        description: Retrieve the URLs for a remote.
        usage: git remote get-url [<options>] <name>
        pool:
          options:
            - {name: Remote get-url push, kind: flag, type: bool, long: --push}
            - {name: Remote get-url all, kind: flag, type: bool, long: --all}
            - {name: Remote get-url name, kind: positional, type: string, required: true}
        options: [Remote get-url push, Remote get-url all, Remote get-url name]

  - name: stash
    description: Stash the changes in a dirty working directory away.
    usage: git stash <subcommand>
    subcommands:
      - name: push
        description: Save your local modifications to a new stash.
        usage: git stash push [<options>] [<pathspec>...]
        pool:
          options:
            - {name: Stash push patch, kind: flag, type: bool, long: --patch, short: "-p"}
            - {name: Stash push staged, kind: flag, type: bool, long: --staged, short: "-S"}
            - {name: Stash push keep index, kind: flag, type: bool, long: --keep-index, short: "-k"}
            - {name: Stash push untracked, kind: flag, type: bool, long: --include-untracked, short: "-u"}
            - {name: Stash push all, kind: flag, type: bool, long: --all, short: "-a"}
            - {name: Stash push message, kind: flag, type: string, long: --message, short: "-m"}
        options: [Quiet, Stash push patch, Stash push staged, Stash push keep index, Stash push untracked, Stash push all, Stash push message, Pathspec]

      - name: pop
        description: Remove a single stashed state and apply it.
        usage: git stash pop [<options>] [<stash>]
        pool:
          options:
            - {name: Stash pop index, kind: flag, type: bool, long: --index}
            - {name: Stash pop name, kind: positional, type: string, required: false}
        options: [Quiet, Stash pop index, Stash pop name]

      - name: apply
        description: Apply a stashed state.
        usage: git stash apply [<options>] [<stash>]
        pool:
          options:
            - {name: Stash apply index, kind: flag, type: bool, long: --index}
            - {name: Stash apply name, kind: positional, type: string, required: false}
        options: [Quiet, Stash apply index, Stash apply name]

      - name: list
        description: List the stashes that you currently have.
        usage: git stash list [<log-options>]
        options: [Max count, Stat, Patch]

      - name: show
        description: Show the changes recorded in a stash.
        usage: git stash show [<options>] [<stash>]
        pool:
          options:
            - {name: Stash show untracked, kind: flag, type: bool, long: --include-untracked, short: "-u"}
            - {name: Stash show only untracked, kind: flag, type: bool, long: --only-untracked}
            - {name: Stash show name, kind: positional, type: string, required: false}
        options: [Stat, Patch, Stash show untracked, Stash show only untracked, Stash show name]

      - name: drop
        description: Remove a single stashed state from the stash list.
        usage: git stash drop [<options>] [<stash>]
        pool:
          options:
            - {name: Stash drop name, kind: positional, type: string, required: false}
        options: [Quiet, Stash drop name]

      - name: branch
        description: Create and check out a new branch starting from a stash.
        usage: git stash branch <branchname> [<stash>]
        pool:
          options:
            - {name: Stash branch name, kind: positional, type: string, required: true}
            - {name: Stash branch stash, kind: positional, type: string, required: false}
        options: [Stash branch name, Stash branch stash]

      - name: clear
        description: Remove all the stashed states.
        usage: git stash clear
        options: []

      - name: create
        description: Create a stash without storing it.
        usage: git stash create [<message>]
        pool:
          options:
            - {name: Stash create message, kind: positional, type: string, required: false}
        options: [Stash create message]

  - name: config
    description: Get and set repository or global options.
    usage: git config <subcommand>
    pool:
      options:
        - {name: Config global, kind: flag, type: bool, long: --global}
        - {name: Config local, kind: flag, type: bool, long: --local}
        - {name: Config worktree, kind: flag, type: bool, long: --worktree}
        - {name: Config file, kind: flag, type: string, long: --file, short: "-f"}
        - {name: Config type, kind: flag, type: enum, long: --type, values: [bool, int, bool-or-int, path, expiry-date, color]}
        - {name: Config all, kind: flag, type: bool, long: --all}
        - {name: Config regexp, kind: flag, type: bool, long: --regexp}
        - {name: Config fixed value, kind: flag, type: bool, long: --fixed-value}
        - {name: Config default, kind: flag, type: string, long: --default}
        - {name: Config includes, kind: flag, type: bool, long: --includes}
        - {name: Config show origin, kind: flag, type: bool, long: --show-origin}
        - {name: Config show scope, kind: flag, type: bool, long: --show-scope}
        - {name: Config null, kind: flag, type: bool, long: --null, short: "-z"}
        - {name: Config name only, kind: flag, type: bool, long: --name-only}
    subcommands:
      - name: get
        description: Emit the value of the given configuration variable.
        usage: git config get [<options>] <name>
        pool:
          options:
            - {name: Config get name, kind: positional, type: string, required: true}
        options: [Config global, Config local, Config type, Config all, Config regexp, Config fixed value, Config default, Config includes, Config show origin, Config get name]

      - name: set
        description: Set the value of a configuration variable.
        usage: git config set [<options>] <name> <value>
        pool:
          options:
            - {name: Config set name, kind: positional, type: string, required: true}
            - {name: Config set value, kind: positional, type: string, required: true}
        options: [Config global, Config local, Config type, Config all, Config fixed value, Config set name, Config set value]

      - name: unset
        description: Remove the value of a configuration variable.
        usage: git config unset [<options>] <name>
        pool:
          options:
            - {name: Config unset name, kind: positional, type: string, required: true}
        options: [Config global, Config local, Config all, Config fixed value, Config unset name]

      - name: list
        description: List all configuration variables and their values.
        usage: git config list [<options>]
        options: [Config global, Config local, Config includes, Config show origin, Config show scope, Config null, Config name only]

      - name: edit
        description: Open an editor to modify the specified config file.
        usage: git config edit [<options>]
        options: [Config global, Config local]

      - name: rename-section
        description: Rename a section in the config file.
        usage: git config rename-section <old-name> <new-name>
        pool:
          options:
            - {name: Config old section, kind: positional, type: string, required: true}
            - {name: Config new section, kind: positional, type: string, required: true}
        options: [Config global, Config local, Config old section, Config new section]

      - name: remove-section
        description: Remove a section from the config file.
        usage: git config remove-section <name>
        pool:
          options:
            - {name: Config section, kind: positional, type: string, required: true}
        options: [Config global, Config local, Config section]
