description: The stupid content tracker.

pool:
  options:
    # -- global options (must precede the subcommand) --
    - {name: Git dir,        kind: flag, type: string, long: --git-dir}
    - {name: Work tree,      kind: flag, type: string, long: --work-tree}
    - {name: Namespace,      kind: flag, type: string, long: --namespace}
    - {name: Config env,     kind: flag, type: string, long: --config-env, repeatable: true}
    - {name: Exec path,      kind: flag, type: string, long: --exec-path}
    - {name: Bare,           kind: flag, type: bool, long: --bare}
    - {name: Paginate,       kind: flag, type: bool, long: --paginate, short: "-p", negative: --no-pager, negative_short: "-P"}
    - {name: No replace objects, kind: flag, type: bool, long: --no-replace-objects}
    - {name: No lazy fetch,  kind: flag, type: bool, long: --no-lazy-fetch}
    - {name: No optional locks, kind: flag, type: bool, long: --no-optional-locks}
    - {name: No advice,      kind: flag, type: bool, long: --no-advice}
    - {name: Html path,      kind: flag, type: bool, long: --html-path}
    - {name: Man path,       kind: flag, type: bool, long: --man-path}
    - {name: Info path,      kind: flag, type: bool, long: --info-path}
    - {name: Version,        kind: flag, type: bool, long: --version, short: "-v"}
    - {name: Help,           kind: flag, type: bool, long: --help, short: "-h"}

    # -- options shared by many subcommands (inherited, not on root) --
    - {name: Quiet,     kind: flag, type: bool, long: --quiet, short: "-q"}
    - {name: Verbose,   kind: flag, type: bool, long: --verbose, short: "-v"}
    - {name: Force,     kind: flag, type: bool, long: --force, short: "-f"}
    - {name: Dry run,   kind: flag, type: bool, long: --dry-run, short: "-n"}
    - {name: Patch,     kind: flag, type: bool, long: --patch, short: "-p"}
    - {name: Progress,  kind: flag, type: bool, long: --progress}
    - {name: Recurse submodules, kind: flag, type: bool, long: --recurse-submodules}
    - {name: Set upstream, kind: flag, type: bool, long: --set-upstream, short: "-u"}
    - {name: Tags,      kind: flag, type: bool, long: --tags, short: "-t"}
    - {name: Prune,     kind: flag, type: bool, long: --prune, short: "-p"}
    - {name: All,       kind: flag, type: bool, long: --all, short: "-a"}
    - {name: Color,     kind: flag, type: enum, long: --color, values: [always, auto, never]}
    - {name: Ignore case, kind: flag, type: bool, long: --ignore-case, short: "-i"}
    - {name: Abbrev,    kind: flag, type: int, long: --abbrev}
    - {name: Max count, kind: flag, type: int, long: --max-count, short: "-n"}
    - {name: Stat,      kind: flag, type: bool, long: --stat}
    - {name: Format,    kind: flag, type: string, long: --format}
    - {name: Trailer,   kind: flag, type: string, long: --trailer, repeatable: true}

    # -- positionals shared by many subcommands --
    - {name: Pathspec,   kind: positional, type: path,   required: false, variadic: true}
    - {name: Refspec,    kind: positional, type: string, required: false, variadic: true}
    - {name: Revision,   kind: positional, type: string, required: false}
    - {name: Repository, kind: positional, type: string, required: false}

usage: git [<global options>] <command> [<args>]

options:
  [Git dir, Work tree, Namespace, Config env, Exec path, Bare, Paginate,
   No replace objects, No lazy fetch, No optional locks, No advice,
   Html path, Man path, Info path, Version, Help]

subcommands:
  - name: add
    description: Add file contents to the index.
    usage: git add [<options>] [--] <pathspec>...
    pool:
      options:
        - {name: Add interactive, kind: flag, type: bool, long: --interactive, short: "-i"}
        - {name: Add edit, kind: flag, type: bool, long: --edit, short: "-e"}
        - {name: Add update, kind: flag, type: bool, long: --update, short: "-u"}
        - {name: Add renormalize, kind: flag, type: bool, long: --renormalize}
        - {name: Add intent to add, kind: flag, type: bool, long: --intent-to-add, short: "-N"}
        - {name: Add ignore removal, kind: flag, type: bool, long: --ignore-removal}
        - {name: Add refresh, kind: flag, type: bool, long: --refresh}
        - {name: Add ignore errors, kind: flag, type: bool, long: --ignore-errors}
        - {name: Add ignore missing, kind: flag, type: bool, long: --ignore-missing}
        - {name: Add sparse, kind: flag, type: bool, long: --sparse}
        - {name: Add chmod, kind: flag, type: string, long: --chmod}
        - {name: Add pathspec file, kind: flag, type: string, long: --pathspec-from-file}
        - {name: Add pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul}
    options:
      [Dry run, Verbose, Add interactive, Patch, Add edit, Force, Add update,
       Add renormalize, Add intent to add, All, Add ignore removal, Add refresh,
       Add ignore errors, Add ignore missing, Add sparse, Add chmod,
       Add pathspec file, Add pathspec nul, Pathspec]

  - name: branch
    description: List, create, or delete branches.
    usage: git branch [<options>] <branch-name> [<start-point>]
    pool:
      options:
        - {name: Branch track, kind: flag, type: bool, long: --track, short: "-t"}
        - {name: Branch set upstream, kind: flag, type: string, long: --set-upstream-to, short: "-u"}
        - {name: Branch unset upstream, kind: flag, type: bool, long: --unset-upstream}
        - {name: Branch remotes, kind: flag, type: bool, long: --remotes, short: "-r"}
        - {name: Branch contains, kind: flag, type: string, long: --contains}
        - {name: Branch no contains, kind: flag, type: string, long: --no-contains}
        - {name: Branch delete, kind: flag, type: bool, long: --delete, short: "-d"}
        - {name: Branch delete force, kind: flag, type: bool, long: --force-delete}
        - {name: Branch move, kind: flag, type: bool, long: --move, short: "-m"}
        - {name: Branch copy, kind: flag, type: bool, long: --copy, short: "-c"}
        - {name: Branch list, kind: flag, type: bool, long: --list, short: "-l"}
        - {name: Branch show current, kind: flag, type: bool, long: --show-current}
        - {name: Branch create reflog, kind: flag, type: bool, long: --create-reflog}
        - {name: Branch edit description, kind: flag, type: bool, long: --edit-description}
        - {name: Branch merged, kind: flag, type: string, long: --merged}
        - {name: Branch no merged, kind: flag, type: string, long: --no-merged}
        - {name: Branch column, kind: flag, type: enum, long: --column, values: [always, auto, never]}
        - {name: Branch sort, kind: flag, type: string, long: --sort}
        - {name: Branch points at, kind: flag, type: string, long: --points-at}
        - {name: Branch name, kind: positional, type: string, required: false}
        - {name: Branch start point, kind: positional, type: string, required: false}
    options:
      [Verbose, Quiet, Branch track, Branch set upstream, Branch unset upstream,
       Branch remotes, Branch contains, Branch no contains, Branch delete,
       Branch delete force, Branch move, Branch copy, Branch list,
       Branch show current, Branch create reflog, Branch edit description,
       Force, Branch merged, Branch no merged, Branch column, Branch sort,
       Branch points at, Ignore case, Recurse submodules, Format,
       Branch name, Branch start point]

  - name: checkout
    description: Switch branches or restore working tree files.
    usage: git checkout [<options>] <branch>
    pool:
      options:
        - {name: Checkout guess, kind: flag, type: bool, long: --guess}
        - {name: Checkout overlay, kind: flag, type: bool, long: --overlay}
        - {name: Checkout merge, kind: flag, type: bool, long: --merge, short: "-m"}
        - {name: Checkout conflict, kind: flag, type: enum, long: --conflict, values: [merge, diff3, zdiff3]}
        - {name: Checkout detach, kind: flag, type: bool, long: --detach, short: "-d"}
        - {name: Checkout track, kind: flag, type: bool, long: --track, short: "-t"}
        - {name: Checkout orphan, kind: flag, type: string, long: --orphan}
        - {name: Checkout overwrite ignore, kind: flag, type: bool, long: --overwrite-ignore}
        - {name: Checkout ignore other worktrees, kind: flag, type: bool, long: --ignore-other-worktrees}
        - {name: Checkout ours, kind: flag, type: bool, long: --ours, short: "-2"}
        - {name: Checkout theirs, kind: flag, type: bool, long: --theirs, short: "-3"}
        - {name: Checkout pathspec file, kind: flag, type: string, long: --pathspec-from-file}
        - {name: Checkout pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul}
        - {name: Checkout branch, kind: positional, type: string, required: false}
    options:
      [Quiet, Checkout guess, Checkout overlay, Recurse submodules, Progress,
       Checkout merge, Checkout conflict, Checkout detach, Checkout track, Force,
       Checkout orphan, Checkout overwrite ignore, Checkout ignore other worktrees,
       Checkout ours, Checkout theirs, Patch, Checkout pathspec file,
       Checkout pathspec nul, Checkout branch, Pathspec]

  - name: switch
    description: Switch branches.
    usage: git switch [<options>] [<branch>]
    pool:
      options:
        - {name: Switch create, kind: flag, type: string, long: --create, short: "-c"}
        - {name: Switch force create, kind: flag, type: string, long: --force-create, short: "-C"}
        - {name: Switch guess, kind: flag, type: bool, long: --guess}
        - {name: Switch discard, kind: flag, type: bool, long: --discard-changes}
        - {name: Switch merge, kind: flag, type: bool, long: --merge, short: "-m"}
        - {name: Switch conflict, kind: flag, type: enum, long: --conflict, values: [merge, diff3, zdiff3]}
        - {name: Switch detach, kind: flag, type: bool, long: --detach, short: "-d"}
        - {name: Switch track, kind: flag, type: bool, long: --track, short: "-t"}
        - {name: Switch orphan, kind: flag, type: string, long: --orphan}
        - {name: Switch overwrite ignore, kind: flag, type: bool, long: --overwrite-ignore}
        - {name: Switch ignore other worktrees, kind: flag, type: bool, long: --ignore-other-worktrees}
        - {name: Switch branch, kind: positional, type: string, required: false}
    options:
      [Switch create, Switch force create, Switch guess, Switch discard, Quiet,
       Recurse submodules, Progress, Switch merge, Switch conflict, Switch detach,
       Switch track, Force, Switch orphan, Switch overwrite ignore,
       Switch ignore other worktrees, Switch branch]

  - name: restore
    description: Restore working tree files.
    usage: git restore [<options>] [--source=<branch>] <file>...
    pool:
      options:
        - {name: Restore source, kind: flag, type: string, long: --source, short: "-s"}
        - {name: Restore staged, kind: flag, type: bool, long: --staged, short: "-S"}
        - {name: Restore worktree, kind: flag, type: bool, long: --worktree, short: "-W"}
        - {name: Restore ignore unmerged, kind: flag, type: bool, long: --ignore-unmerged}
        - {name: Restore overlay, kind: flag, type: bool, long: --overlay}
        - {name: Restore merge, kind: flag, type: bool, long: --merge, short: "-m"}
        - {name: Restore conflict, kind: flag, type: enum, long: --conflict, values: [merge, diff3, zdiff3]}
        - {name: Restore ours, kind: flag, type: bool, long: --ours, short: "-2"}
        - {name: Restore theirs, kind: flag, type: bool, long: --theirs, short: "-3"}
        - {name: Restore pathspec file, kind: flag, type: string, long: --pathspec-from-file}
        - {name: Restore pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul}
    options:
      [Restore source, Restore staged, Restore worktree, Restore ignore unmerged,
       Restore overlay, Quiet, Recurse submodules, Progress, Restore merge,
       Restore conflict, Restore ours, Restore theirs, Patch,
       Restore pathspec file, Restore pathspec nul, Pathspec]

  - name: clone
    description: Clone a repository into a new directory.
    usage: git clone [<options>] [--] <repo> [<dir>]
    pool:
      options:
        - {name: Clone local, kind: flag, type: bool, long: --local, short: "-l"}
        - {name: Clone no hardlinks, kind: flag, type: bool, long: --no-hardlinks}
        - {name: Clone shared, kind: flag, type: bool, long: --shared, short: "-s"}
        - {name: Clone mirror, kind: flag, type: bool, long: --mirror}
        - {name: Clone no checkout, kind: flag, type: bool, long: --no-checkout}
        - {name: Clone jobs, kind: flag, type: int, long: --jobs, short: "-j"}
        - {name: Clone template, kind: flag, type: string, long: --template}
        - {name: Clone reference, kind: flag, type: string, long: --reference}
        - {name: Clone reference if able, kind: flag, type: string, long: --reference-if-able}
        - {name: Clone dissociate, kind: flag, type: bool, long: --dissociate}
        - {name: Clone origin, kind: flag, type: string, long: --origin, short: "-o"}
        - {name: Clone branch, kind: flag, type: string, long: --branch, short: "-b"}
        - {name: Clone revision, kind: flag, type: string, long: --revision}
        - {name: Clone upload pack, kind: flag, type: string, long: --upload-pack, short: "-u"}
        - {name: Clone depth, kind: flag, type: int, long: --depth}
        - {name: Clone shallow since, kind: flag, type: string, long: --shallow-since}
        - {name: Clone shallow exclude, kind: flag, type: string, long: --shallow-exclude}
        - {name: Clone single branch, kind: flag, type: bool, long: --single-branch}
        - {name: Clone shallow submodules, kind: flag, type: bool, long: --shallow-submodules}
        - {name: Clone separate git dir, kind: flag, type: string, long: --separate-git-dir}
        - {name: Clone config, kind: flag, type: string, long: --config, short: "-c", repeatable: true}
        - {name: Clone server option, kind: flag, type: string, long: --server-option, repeatable: true}
        - {name: Clone ipv4, kind: flag, type: bool, long: --ipv4, short: "-4"}
        - {name: Clone ipv6, kind: flag, type: bool, long: --ipv6, short: "-6"}
        - {name: Clone filter, kind: flag, type: string, long: --filter}
        - {name: Clone remote submodules, kind: flag, type: bool, long: --remote-submodules}
        - {name: Clone sparse, kind: flag, type: bool, long: --sparse}
        - {name: Clone reject shallow, kind: flag, type: bool, long: --reject-shallow}
        - {name: Clone source, kind: positional, type: string, required: true}
        - {name: Clone directory, kind: positional, type: path, required: false}
    options:
      [Verbose, Quiet, Progress, Clone reject shallow, Clone no checkout, Bare,
       Clone mirror, Clone local, Clone no hardlinks, Clone shared,
       Recurse submodules, Clone jobs, Clone template, Clone reference,
       Clone reference if able, Clone dissociate, Clone origin, Clone branch,
       Clone revision, Clone upload pack, Clone depth, Clone shallow since,
       Clone shallow exclude, Clone single branch, Tags, Clone shallow submodules,
       Clone separate git dir, Clone config, Clone server option, Clone ipv4,
       Clone ipv6, Clone filter, Clone remote submodules, Clone sparse,
       Clone source, Clone directory]

  - name: commit
    description: Record changes to the repository.
    usage: git commit [<options>] [--] [<pathspec>...]
    pool:
      options:
        - {name: Commit file, kind: flag, type: string, long: --file, short: "-F"}
        - {name: Commit author, kind: flag, type: string, long: --author}
        - {name: Commit date, kind: flag, type: string, long: --date}
        - {name: Commit message, kind: flag, type: string, long: --message, short: "-m"}
        - {name: Commit reedit message, kind: flag, type: string, long: --reedit-message, short: "-c"}
        - {name: Commit reuse message, kind: flag, type: string, long: --reuse-message, short: "-C"}
        - {name: Commit fixup, kind: flag, type: string, long: --fixup}
        - {name: Commit squash, kind: flag, type: string, long: --squash}
        - {name: Commit reset author, kind: flag, type: bool, long: --reset-author}
        - {name: Commit signoff, kind: flag, type: bool, long: --signoff, short: "-s"}
        - {name: Commit template, kind: flag, type: string, long: --template, short: "-t"}
        - {name: Commit edit, kind: flag, type: bool, long: --edit, short: "-e"}
        - {name: Commit cleanup, kind: flag, type: enum, long: --cleanup, values: [strip, whitespace, verbatim, scissors, default]}
        - {name: Commit status, kind: flag, type: bool, long: --status}
        - {name: Commit gpg sign, kind: flag, type: bool, long: --gpg-sign, short: "-S"}
        - {name: Commit all, kind: flag, type: bool, long: --all, short: "-a"}
        - {name: Commit include, kind: flag, type: bool, long: --include, short: "-i"}
        - {name: Commit interactive, kind: flag, type: bool, long: --interactive}
        - {name: Commit only, kind: flag, type: bool, long: --only, short: "-o"}
        - {name: Commit no verify, kind: flag, type: bool, long: --no-verify, short: "-n"}
        - {name: Commit dry run, kind: flag, type: bool, long: --dry-run}
        - {name: Commit short, kind: flag, type: bool, long: --short}
        - {name: Commit branch, kind: flag, type: bool, long: --branch}
        - {name: Commit ahead behind, kind: flag, type: bool, long: --ahead-behind}
        - {name: Commit porcelain, kind: flag, type: bool, long: --porcelain}
        - {name: Commit long, kind: flag, type: bool, long: --long}
        - {name: Commit null, kind: flag, type: bool, long: --null, short: "-z"}
        - {name: Commit amend, kind: flag, type: bool, long: --amend}
        - {name: Commit untracked files, kind: flag, type: enum, long: --untracked-files, values: [all, normal, no]}
        - {name: Commit pathspec file, kind: flag, type: string, long: --pathspec-from-file}
        - {name: Commit pathspec nul, kind: flag, type: bool, long: --pathspec-file-nul}
    options:
      [Quiet, Verbose, Commit file, Commit author, Commit date, Commit message,
       Commit reedit message, Commit reuse message, Commit fixup, Commit squash,
       Commit reset author, Trailer, Commit signoff, Commit template, Commit edit,
       Commit cleanup, Commit status, Commit gpg sign, Commit all, Commit include,
       Commit interactive, Patch, Commit only, Commit no verify, Commit dry run,
       Commit short, Commit branch, Commit ahead behind, Commit porcelain,
       Commit long, Commit null, Commit amend, Commit untracked files,
       Commit pathspec file, Commit pathspec nul, Pathspec]

  - name: diff
    description: Show changes between commits, commit and working tree, etc.
    usage: git diff [<options>] [<commit>] [--] [<path>...]
    pool:
      options:
        - {name: Diff cached, kind: flag, type: bool, long: --cached}
        - {name: Diff merge base, kind: flag, type: bool, long: --merge-base}
        - {name: Diff no index, kind: flag, type: bool, long: --no-index}
        - {name: Diff stat, kind: flag, type: bool, long: --stat}
        - {name: Diff numstat, kind: flag, type: bool, long: --numstat}
        - {name: Diff name only, kind: flag, type: bool, long: --name-only}
        - {name: Diff name status, kind: flag, type: bool, long: --name-status}
        - {name: Diff full index, kind: flag, type: bool, long: --full-index}
        - {name: Diff patch with raw, kind: flag, type: bool, long: --patch-with-raw}
        - {name: Diff patch with stat, kind: flag, type: bool, long: --patch-with-stat}
        - {name: Diff raw, kind: flag, type: bool, long: --raw, short: "-z"}
        - {name: Diff rewrites, kind: flag, type: bool, long: --break-rewrites, short: "-B"}
        - {name: Diff renames, kind: flag, type: bool, long: --find-renames, short: "-M"}
        - {name: Diff copies, kind: flag, type: bool, long: --find-copies, short: "-C"}
        - {name: Diff find copies harder, kind: flag, type: bool, long: --find-copies-harder}
        - {name: Diff pickaxe all, kind: flag, type: bool, long: --pickaxe-all}
        - {name: Diff text, kind: flag, type: bool, long: --text, short: "-a"}
    options:
      [Patch, Diff cached, Diff merge base, Diff no index, Diff stat, Diff numstat,
       Diff name only, Diff name status, Diff full index, Abbrev, Diff patch with raw,
       Diff patch with stat, Diff raw, Diff rewrites, Diff renames, Diff copies,
       Diff find copies harder, Diff pickaxe all, Diff text, Revision, Pathspec]

  - name: fetch
    description: Download objects and refs from another repository.
    usage: git fetch [<options>] [<repository> [<refspec>...]]
    pool:
      options:
        - {name: Fetch append, kind: flag, type: bool, long: --append, short: "-a"}
        - {name: Fetch atomic, kind: flag, type: bool, long: --atomic}
        - {name: Fetch upload pack, kind: flag, type: string, long: --upload-pack}
        - {name: Fetch multiple, kind: flag, type: bool, long: --multiple, short: "-m"}
        - {name: Fetch no tags, kind: flag, type: bool, long: --no-tags, short: "-n"}
        - {name: Fetch jobs, kind: flag, type: int, long: --jobs, short: "-j"}
        - {name: Fetch prefetch, kind: flag, type: bool, long: --prefetch}
        - {name: Fetch prune tags, kind: flag, type: bool, long: --prune-tags, short: "-P"}
        - {name: Fetch porcelain, kind: flag, type: bool, long: --porcelain}
        - {name: Fetch write head, kind: flag, type: bool, long: --write-fetch-head}
        - {name: Fetch keep, kind: flag, type: bool, long: --keep, short: "-k"}
        - {name: Fetch update head ok, kind: flag, type: bool, long: --update-head-ok, short: "-u"}
        - {name: Fetch depth, kind: flag, type: int, long: --depth}
        - {name: Fetch shallow since, kind: flag, type: string, long: --shallow-since}
        - {name: Fetch shallow exclude, kind: flag, type: string, long: --shallow-exclude}
        - {name: Fetch deepen, kind: flag, type: int, long: --deepen}
        - {name: Fetch unshallow, kind: flag, type: bool, long: --unshallow}
        - {name: Fetch refetch, kind: flag, type: bool, long: --refetch}
        - {name: Fetch update shallow, kind: flag, type: bool, long: --update-shallow}
        - {name: Fetch refmap, kind: flag, type: string, long: --refmap}
        - {name: Fetch server option, kind: flag, type: string, long: --server-option, short: "-o", repeatable: true}
        - {name: Fetch ipv4, kind: flag, type: bool, long: --ipv4, short: "-4"}
        - {name: Fetch ipv6, kind: flag, type: bool, long: --ipv6, short: "-6"}
        - {name: Fetch negotiation tip, kind: flag, type: string, long: --negotiation-tip, repeatable: true}
        - {name: Fetch negotiate only, kind: flag, type: bool, long: --negotiate-only}
        - {name: Fetch filter, kind: flag, type: string, long: --filter}
        - {name: Fetch auto maintenance, kind: flag, type: bool, long: --auto-maintenance}
        - {name: Fetch show forced, kind: flag, type: bool, long: --show-forced-updates}
        - {name: Fetch commit graph, kind: flag, type: bool, long: --write-commit-graph}
        - {name: Fetch stdin, kind: flag, type: bool, long: --stdin}
    options:
      [Verbose, Quiet, All, Set upstream, Fetch append, Fetch atomic,
       Fetch upload pack, Force, Fetch multiple, Tags, Fetch no tags, Fetch jobs,
       Fetch prefetch, Prune, Fetch prune tags, Recurse submodules, Dry run,
       Fetch porcelain, Fetch write head, Fetch keep, Fetch update head ok,
       Progress, Fetch depth, Fetch shallow since, Fetch shallow exclude,
       Fetch deepen, Fetch unshallow, Fetch refetch, Fetch update shallow,
       Fetch refmap, Fetch server option, Fetch ipv4, Fetch ipv6,
       Fetch negotiation tip, Fetch negotiate only, Fetch filter,
       Fetch auto maintenance, Fetch show forced, Fetch commit graph, Fetch stdin,
       Repository, Refspec]

  - name: log
    description: Show commit logs.
    usage: git log [<options>] [<revision-range>] [[--] <path>...]
    pool:
      options:
        - {name: Log oneline, kind: flag, type: bool, long: --oneline}
        - {name: Log graph, kind: flag, type: bool, long: --graph}
        - {name: Log decorate, kind: flag, type: bool, long: --decorate}
        - {name: Log source, kind: flag, type: bool, long: --source}
        - {name: Log use mailmap, kind: flag, type: bool, long: --use-mailmap}
        - {name: Log skip, kind: flag, type: int, long: --skip}
        - {name: Log since, kind: flag, type: string, long: --since}
        - {name: Log until, kind: flag, type: string, long: --until}
        - {name: Log author, kind: flag, type: string, long: --author}
        - {name: Log committer, kind: flag, type: string, long: --committer}
