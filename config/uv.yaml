description: "An extremely fast Python package manager."
usage: "uv [OPTIONS] <COMMAND>"
pool:
  options:
    - {name: No Cache, kind: flag, type: bool, long: --no-cache, short: "-n", description: "Avoid reading from or writing to the cache, instead using a temporary directory for the duration of the operation"}
    - {name: Cache Dir, kind: flag, type: string, long: --cache-dir, description: "Path to the cache directory"}
    - {name: Managed Python, kind: flag, type: bool, long: --managed-python, description: "Require use of uv-managed Python versions"}
    - {name: No Managed Python, kind: flag, type: bool, long: --no-managed-python, description: "Disable use of uv-managed Python versions"}
    - {name: No Python Downloads, kind: flag, type: bool, long: --no-python-downloads, description: "Disable automatic downloads of Python."}
    - {name: Quiet, kind: flag, type: count, long: --quiet, short: "-q", description: "Use quiet output"}
    - {name: Verbose, kind: flag, type: count, long: --verbose, short: "-v", description: "Use verbose output"}
    - {name: Color, kind: flag, type: enum, long: --color, values: [auto, always, never], description: "Control the use of color in output"}
    - {name: Native TLS, kind: flag, type: bool, long: --native-tls, description: "Whether to load TLS certificates from the platform's native certificate store"}
    - {name: Offline, kind: flag, type: bool, long: --offline, description: "Disable network access"}
    - {name: Allow Insecure Host, kind: flag, type: string, long: --allow-insecure-host, repeatable: true, description: "Allow insecure connections to a host"}
    - {name: No Progress, kind: flag, type: bool, long: --no-progress, description: "Hide all progress outputs"}
    - {name: Directory, kind: flag, type: string, long: --directory, description: "Change to the given directory prior to running the command"}
    - {name: Project, kind: flag, type: string, long: --project, description: "Run the command within the given project directory"}
    - {name: Config File, kind: flag, type: string, long: --config-file, description: "The path to a `uv.toml` file to use for configuration"}
    - {name: No Config, kind: flag, type: bool, long: --no-config, description: "Avoid discovering configuration files (`pyproject.toml`, `uv.toml`)"}
    - {name: Help, kind: flag, type: bool, long: --help, short: "-h", description: "Display the concise help for this command"}
    - {name: Version, kind: flag, type: bool, long: --version, short: "-V", description: "Display the uv version Use `uv help` for more details."}
options: [No Cache, Cache Dir, Managed Python, No Managed Python, No Python Downloads, Quiet, Verbose, Color, Native TLS, Offline, Allow Insecure Host, No Progress, Directory, Project, Config File, No Config, Help, Version]
subcommands:
  - name: run
    description: "Run a command or script"
    usage: "uv run [OPTIONS] [COMMAND]"
    pool:
      options:
        - {name: Extra, kind: flag, type: string, long: --extra, description: "Include optional dependencies from the specified extra name"}
        - {name: All Extras, kind: flag, type: bool, long: --all-extras, description: "Include all optional dependencies"}
        - {name: No Extra, kind: flag, type: string, long: --no-extra, description: "Exclude the specified optional dependencies, if `--all-extras` is supplied"}
        - {name: No Dev, kind: flag, type: bool, long: --no-dev, description: "Disable the development dependency group"}
        - {name: Group, kind: flag, type: string, long: --group, repeatable: true, description: "Include dependencies from the specified dependency group"}
        - {name: No Group, kind: flag, type: string, long: --no-group, description: "Disable the specified dependency group"}
        - {name: No Default Groups, kind: flag, type: bool, long: --no-default-groups, description: "Ignore the default dependency groups"}
        - {name: Only Group, kind: flag, type: string, long: --only-group, description: "Only include dependencies from the specified dependency group"}
        - {name: All Groups, kind: flag, type: bool, long: --all-groups, description: "Include dependencies from all dependency groups"}
        - {name: Module, kind: flag, type: bool, long: --module, short: "-m", description: "Run a Python module"}
        - {name: Only Dev, kind: flag, type: bool, long: --only-dev, description: "Only include the development dependency group"}
        - {name: No Editable, kind: flag, type: bool, long: --no-editable, description: "Install any editable dependencies, including the project and any workspace members, as non-editable"}
        - {name: Exact, kind: flag, type: bool, long: --exact, description: "Perform an exact sync, removing extraneous packages"}
        - {name: Env File, kind: flag, type: string, long: --env-file, repeatable: true, description: "Load environment variables from a `.env` file"}
        - {name: No Env File, kind: flag, type: bool, long: --no-env-file, description: "Avoid reading environment variables from a `.env` file"}
        - {name: With, kind: flag, type: string, long: --with, short: "-w", repeatable: true, description: "Run with the given packages installed"}
        - {name: With Editable, kind: flag, type: string, long: --with-editable, description: "Run with the given packages installed in editable mode"}
        - {name: With Requirements, kind: flag, type: string, long: --with-requirements, description: "Run with all packages listed in the given `requirements.txt` files"}
        - {name: Isolated, kind: flag, type: bool, long: --isolated, description: "Run the command in an isolated virtual environment"}
        - {name: Active, kind: flag, type: bool, long: --active, description: "Prefer the active virtual environment over the project's virtual environment"}
        - {name: No Sync, kind: flag, type: bool, long: --no-sync, description: "Avoid syncing the virtual environment"}
        - {name: Locked, kind: flag, type: bool, long: --locked, description: "Assert that the `uv.lock` will remain unchanged"}
        - {name: Frozen, kind: flag, type: bool, long: --frozen, description: "Run without updating the `uv.lock` file"}
        - {name: Script, kind: flag, type: bool, long: --script, short: "-s", description: "Run the given path as a Python script"}
        - {name: GUI Script, kind: flag, type: bool, long: --gui-script, description: "Run the given path as a Python GUI script"}
        - {name: All Packages, kind: flag, type: bool, long: --all-packages, description: "Run the command with all workspace members installed"}
        - {name: Package, kind: flag, type: string, long: --package, description: "Run the command in a specific package in the workspace"}
        - {name: No Project, kind: flag, type: bool, long: --no-project, description: "Avoid discovering the project or workspace"}
        - {name: Index, kind: flag, type: string, long: --index, repeatable: true, description: "The URLs to use when resolving dependencies, in addition to the default index"}
        - {name: Default Index, kind: flag, type: string, long: --default-index, description: "The URL of the default package index (by default: <https://pypi.org/simple>)"}
        - {name: Index URL, kind: flag, type: string, long: --index-url, short: "-i", description: "(Deprecated: use `--default-index` instead) The URL of the Python package index (by default: <https://pypi.org/simple>)"}
        - {name: Extra Index URL, kind: flag, type: string, long: --extra-index-url, repeatable: true, description: "(Deprecated: use `--index` instead) Extra URLs of package indexes to use, in addition to `--index-url`"}
        - {name: Find Links, kind: flag, type: string, long: --find-links, short: "-f", repeatable: true, description: "Locations to search for candidate distributions, in addition to those found in the registry indexes"}
        - {name: No Index, kind: flag, type: bool, long: --no-index, description: "Ignore the registry index (e.g., PyPI), instead relying on direct URL dependencies and those provided via `--find-links`"}
        - {name: Index Strategy, kind: flag, type: enum, long: --index-strategy, values: [first-index, unsafe-first-match, unsafe-best-match], description: "The strategy to use when resolving against multiple index URLs"}
        - {name: Keyring Provider, kind: flag, type: enum, long: --keyring-provider, values: [disabled, subprocess], description: "Attempt to use `keyring` for authentication for index URLs"}
        - {name: Upgrade, kind: flag, type: bool, long: --upgrade, short: "-U", description: "Allow package upgrades, ignoring pinned versions in any existing output file. Implies `--refresh`"}
        - {name: Upgrade Package, kind: flag, type: string, long: --upgrade-package, short: "-P", description: "Allow upgrades for a specific package, ignoring pinned versions in any existing output file. Implies `--refresh-package`"}
        - {name: Resolution, kind: flag, type: enum, long: --resolution, values: [highest, lowest, lowest-direct], description: "The strategy to use when selecting between the different compatible versions for a given package requirement"}
        - {name: Prerelease, kind: flag, type: enum, long: --prerelease, values: [disallow, allow, if-necessary, explicit, if-necessary-or-explicit], description: "The strategy to use when considering pre-release versions"}
        - {name: Fork Strategy, kind: flag, type: enum, long: --fork-strategy, values: [fewest, requires-python], description: "The strategy to use when selecting multiple versions of a given package across Python versions and platforms"}
        - {name: Exclude Newer, kind: flag, type: string, long: --exclude-newer, description: "Limit candidate packages to those that were uploaded prior to the given date"}
        - {name: No Sources, kind: flag, type: bool, long: --no-sources, description: "Ignore the `tool.uv.sources` table when resolving dependencies. Used to lock against the standards-compliant, publishable package metadata, as opposed to using any workspace, Git, URL, or local path sources"}
        - {name: Reinstall, kind: flag, type: bool, long: --reinstall, description: "Reinstall all packages, regardless of whether they're already installed. Implies `--refresh`"}
        - {name: Reinstall Package, kind: flag, type: string, long: --reinstall-package, repeatable: true, description: "Reinstall a specific package, regardless of whether it's already installed. Implies `--refresh-package`"}
        - {name: Link Mode, kind: flag, type: enum, long: --link-mode, values: [clone, copy, hardlink, symlink], description: "The method to use when installing packages from the global cache"}
        - {name: Compile Bytecode, kind: flag, type: bool, long: --compile-bytecode, description: "Compile Python files to bytecode after installation"}
        - {name: Config Setting, kind: flag, type: string, long: --config-setting, short: "-C", description: "Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs"}
        - {name: No Build Isolation, kind: flag, type: bool, long: --no-build-isolation, description: "Disable isolation when building source distributions"}
        - {name: No Build Isolation Package, kind: flag, type: string, long: --no-build-isolation-package, description: "Disable isolation when building source distributions for a specific package"}
        - {name: No Build, kind: flag, type: bool, long: --no-build, description: "Don't build source distributions"}
        - {name: No Build Package, kind: flag, type: string, long: --no-build-package, description: "Don't build source distributions for a specific package"}
        - {name: No Binary, kind: flag, type: bool, long: --no-binary, repeatable: true, description: "Don't install pre-built wheels"}
        - {name: No Binary Package, kind: flag, type: string, long: --no-binary-package, description: "Don't install pre-built wheels for a specific package"}
        - {name: Refresh, kind: flag, type: bool, long: --refresh, description: "Refresh all cached data"}
        - {name: Refresh Package, kind: flag, type: string, long: --refresh-package, description: "Refresh cached data for a specific package"}
        - {name: Python, kind: flag, type: string, long: --python, short: "-p", description: "The Python interpreter to use for the run environment."}
        - {name: COMMAND, kind: positional, type: passthrough}
    options: [Extra, All Extras, No Extra, No Dev, Group, No Group, No Default Groups, Only Group, All Groups, Module, Only Dev, No Editable, Exact, Env File, No Env File, With, With Editable, With Requirements, Isolated, Active, No Sync, Locked, Frozen, Script, GUI Script, All Packages, Package, No Project, Index, Default Index, Index URL, Extra Index URL, Find Links, No Index, Index Strategy, Keyring Provider, Upgrade, Upgrade Package, Resolution, Prerelease, Fork Strategy, Exclude Newer, No Sources, Reinstall, Reinstall Package, Link Mode, Compile Bytecode, Config Setting, No Build Isolation, No Build Isolation Package, No Build, No Build Package, No Binary, No Binary Package, Refresh, Refresh Package, Python, COMMAND]
  - name: init
    description: "Create a new project"
    usage: "uv init [OPTIONS] [PATH]"
    pool:
      options:
        - {name: Name, kind: flag, type: string, long: --name, description: "The name of the project"}
        - {name: Bare, kind: flag, type: bool, long: --bare, description: "Only create a `pyproject.toml`"}
        - {name: Package, kind: flag, type: bool, long: --package, description: "Set up the project to be built as a Python package"}
        - {name: No Package, kind: flag, type: bool, long: --no-package, description: "Do not set up the project to be built as a Python package"}
        - {name: App, kind: flag, type: bool, long: --app, description: "Create a project for an application"}
        - {name: Lib, kind: flag, type: bool, long: --lib, description: "Create a project for a library"}
        - {name: Script, kind: flag, type: bool, long: --script, description: "Create a script"}
        - {name: Description, kind: flag, type: string, long: --description, description: "Set the project description"}
        - {name: No Description, kind: flag, type: bool, long: --no-description, description: "Disable the description for the project"}
        - {name: VCS, kind: flag, type: enum, long: --vcs, values: [git, none], description: "Initialize a version control system for the project"}
        - {name: Build Backend, kind: flag, type: enum, long: --build-backend, values: [hatch, flit, pdm, poetry, setuptools, maturin, scikit], description: "Initialize a build-backend of choice for the project"}
        - {name: No Readme, kind: flag, type: bool, long: --no-readme, description: "Do not create a `README.md` file"}
        - {name: Author From, kind: flag, type: enum, long: --author-from, values: [auto, git, none], description: "Fill in the `authors` field in the `pyproject.toml`"}
        - {name: No Pin Python, kind: flag, type: bool, long: --no-pin-python, description: "Do not create a `.python-version` file for the project"}
        - {name: No Workspace, kind: flag, type: bool, long: --no-workspace, description: "Avoid discovering a workspace and create a standalone project"}
        - {name: Python, kind: flag, type: string, long: --python, short: "-p", description: "The Python interpreter to use to determine the minimum supported Python version."}
        - {name: PATH, kind: positional, type: string, description: "The path to use for the project/script"}
    options: [Name, Bare, Package, No Package, App, Lib, Script, Description, No Description, VCS, Build Backend, No Readme, Author From, No Pin Python, No Workspace, Python, PATH]
  - name: add
    description: "Add dependencies to the project"
    usage: "uv add [OPTIONS] <PACKAGES|--requirements <REQUIREMENTS>>"
    pool:
      options:
        - {name: Requirements, kind: flag, type: string, long: --requirements, short: "-r", repeatable: true, description: "Add all packages listed in the given `requirements.txt` files"}
        - {name: Constraints, kind: flag, type: string, long: --constraints, short: "-c", repeatable: true, description: "Constrain versions using the given requirements files"}
        - {name: Marker, kind: flag, type: string, long: --marker, short: "-m", description: "Apply this marker to all added packages"}
        - {name: Dev, kind: flag, type: bool, long: --dev, description: "Add the requirements to the development dependency group"}
        - {name: Optional, kind: flag, type: string, long: --optional, repeatable: true, description: "Add the requirements to the package's optional dependencies for the specified extra"}
        - {name: Group, kind: flag, type: string, long: --group, repeatable: true, description: "Add the requirements to the specified dependency group"}
        - {name: Editable, kind: flag, type: bool, long: --editable, description: "Add the requirements as editable"}
        - {name: Raw, kind: flag, type: bool, long: --raw, description: "Add a dependency as provided"}
        - {name: Bounds, kind: flag, type: enum, long: --bounds, values: [lower, major, minor, exact], description: "The kind of version specifier to use when adding dependencies"}
        - {name: Rev, kind: flag, type: string, long: --rev, description: "Commit to use when adding a dependency from Git"}
        - {name: Tag, kind: flag, type: string, long: --tag, description: "Tag to use when adding a dependency from Git"}
        - {name: Branch, kind: flag, type: string, long: --branch, description: "Branch to use when adding a dependency from Git"}
        - {name: Extra, kind: flag, type: string, long: --extra, description: "Extras to enable for the dependency"}
        - {name: No Sync, kind: flag, type: bool, long: --no-sync, description: "Avoid syncing the virtual environment"}
        - {name: Locked, kind: flag, type: bool, long: --locked, description: "Assert that the `uv.lock` will remain unchanged"}
        - {name: Frozen, kind: flag, type: bool, long: --frozen, description: "Add dependencies without re-locking the project"}
        - {name: Active, kind: flag, type: bool, long: --active, description: "Prefer the active virtual environment over the project's virtual environment"}
        - {name: Package, kind: flag, type: string, long: --package, description: "Add the dependency to a specific package in the workspace"}
        - {name: Script, kind: flag, type: string, long: --script, description: "Add the dependency to the specified Python script, rather than to a project"}
        - {name: Workspace, kind: flag, type: bool, long: --workspace, description: "Add the dependency as a workspace member"}
        - {name: Index, kind: flag, type: string, long: --index, repeatable: true, description: "The URLs to use when resolving dependencies, in addition to the default index"}
        - {name: Default Index, kind: flag, type: string, long: --default-index, description: "The URL of the default package index (by default: <https://pypi.org/simple>)"}
        - {name: Index URL, kind: flag, type: string, long: --index-url, short: "-i", description: "(Deprecated: use `--default-index` instead) The URL of the Python package index (by default: <https://pypi.org/simple>)"}
        - {name: Extra Index URL, kind: flag, type: string, long: --extra-index-url, repeatable: true, description: "(Deprecated: use `--index` instead) Extra URLs of package indexes to use, in addition to `--index-url`"}
        - {name: Find Links, kind: flag, type: string, long: --find-links, short: "-f", repeatable: true, description: "Locations to search for candidate distributions, in addition to those found in the registry indexes"}
        - {name: No Index, kind: flag, type: bool, long: --no-index, description: "Ignore the registry index (e.g., PyPI), instead relying on direct URL dependencies and those provided via `--find-links`"}
        - {name: Index Strategy, kind: flag, type: enum, long: --index-strategy, values: [first-index, unsafe-first-match, unsafe-best-match], description: "The strategy to use when resolving against multiple index URLs"}
        - {name: Keyring Provider, kind: flag, type: enum, long: --keyring-provider, values: [disabled, subprocess], description: "Attempt to use `keyring` for authentication for index URLs"}
        - {name: Upgrade, kind: flag, type: bool, long: --upgrade, short: "-U", description: "Allow package upgrades, ignoring pinned versions in any existing output file. Implies `--refresh`"}
        - {name: Upgrade Package, kind: flag, type: string, long: --upgrade-package, short: "-P", description: "Allow upgrades for a specific package, ignoring pinned versions in any existing output file. Implies `--refresh-package`"}
        - {name: Resolution, kind: flag, type: enum, long: --resolution, values: [highest, lowest, lowest-direct], description: "The strategy to use when selecting between the different compatible versions for a given package requirement"}
        - {name: Prerelease, kind: flag, type: enum, long: --prerelease, values: [disallow, allow, if-necessary, explicit, if-necessary-or-explicit], description: "The strategy to use when considering pre-release versions"}
        - {name: Fork Strategy, kind: flag, type: enum, long: --fork-strategy, values: [fewest, requires-python], description: "The strategy to use when selecting multiple versions of a given package across Python versions and platforms"}
        - {name: Exclude Newer, kind: flag, type: string, long: --exclude-newer, description: "Limit candidate packages to those that were uploaded prior to the given date"}
        - {name: No Sources, kind: flag, type: bool, long: --no-sources, description: "Ignore the `tool.uv.sources` table when resolving dependencies. Used to lock against the standards-compliant, publishable package metadata, as opposed to using any workspace, Git, URL, or local path sources"}
        - {name: Reinstall, kind: flag, type: bool, long: --reinstall, description: "Reinstall all packages, regardless of whether they're already installed. Implies `--refresh`"}
        - {name: Reinstall Package, kind: flag, type: string, long: --reinstall-package, repeatable: true, description: "Reinstall a specific package, regardless of whether it's already installed. Implies `--refresh-package`"}
        - {name: Link Mode, kind: flag, type: enum, long: --link-mode, values: [clone, copy, hardlink, symlink], description: "The method to use when installing packages from the global cache"}
        - {name: Compile Bytecode, kind: flag, type: bool, long: --compile-bytecode, description: "Compile Python files to bytecode after installation"}
        - {name: Config Setting, kind: flag, type: string, long: --config-setting, short: "-C", description: "Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs"}
        - {name: No Build Isolation, kind: flag, type: bool, long: --no-build-isolation, description: "Disable isolation when building source distributions"}
        - {name: No Build Isolation Package, kind: flag, type: string, long: --no-build-isolation-package, description: "Disable isolation when building source distributions for a specific package"}
        - {name: No Build, kind: flag, type: bool, long: --no-build, description: "Don't build source distributions"}
        - {name: No Build Package, kind: flag, type: string, long: --no-build-package, description: "Don't build source distributions for a specific package"}
        - {name: No Binary, kind: flag, type: bool, long: --no-binary, repeatable: true, description: "Don't install pre-built wheels"}
        - {name: No Binary Package, kind: flag, type: string, long: --no-binary-package, description: "Don't install pre-built wheels for a specific package"}
        - {name: Refresh, kind: flag, type: bool, long: --refresh, description: "Refresh all cached data"}
        - {name: Refresh Package, kind: flag, type: string, long: --refresh-package, description: "Refresh cached data for a specific package"}
        - {name: Python, kind: flag, type: string, long: --python, short: "-p", description: "The Python interpreter to use for resolving and syncing."}
        - {name: PACKAGES, kind: positional, type: string, variadic: true, description: "The packages to add, as PEP 508 requirements (e.g., `ruff==0.5.0`)"}
    options: [Requirements, Constraints, Marker, Dev, Optional, Group, Editable, Raw, Bounds, Rev, Tag, Branch, Extra, No Sync, Locked, Frozen, Active, Package, Script, Workspace, Index, Default Index, Index URL, Extra Index URL, Find Links, No Index, Index Strategy, Keyring Provider, Upgrade, Upgrade Package, Resolution, Prerelease, Fork Strategy, Exclude Newer, No Sources, Reinstall, Reinstall Package, Link Mode, Compile Bytecode, Config Setting, No Build Isolation, No Build Isolation Package, No Build, No Build Package, No Binary, No Binary Package, Refresh, Refresh Package, Python, PACKAGES]
  - name: remove
    description: "Remove dependencies from the project"
    usage: "uv remove [OPTIONS] <PACKAGES>..."
    pool:
      options:
        - {name: Dev, kind: flag, type: bool, long: --dev, description: "Remove the packages from the development dependency group"}
        - {name: Optional, kind: flag, type: string, long: --optional, repeatable: true, description: "Remove the packages from the project's optional dependencies for the specified extra"}
        - {name: Group, kind: flag, type: string, long: --group, repeatable: true, description: "Remove the packages from the specified dependency group"}
