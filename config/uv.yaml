  - name: cache
    description: "Manage uv's cache"
    usage: "uv cache [OPTIONS] <COMMAND>"
    subcommands:
      - name: clean
        description: "Clear the cache, removing all entries or those linked to specific packages"
        usage: "uv cache clean [OPTIONS] [PACKAGE]..."
        pool:
          options:
            - {name: PACKAGE, kind: positional, type: string, variadic: true, description: "The packages to remove from the cache"}
        options: [PACKAGE]
      - name: prune
        description: "Prune all unreachable objects from the cache"
        usage: "uv cache prune [OPTIONS]"
        pool:
          options:
            - {name: Ci, kind: flag, type: bool, long: --ci, description: "Optimize the cache for persistence in a continuous integration environment, like GitHub Actions"}
        options: [Ci]
      - name: dir
        description: "Show the cache directory"
        usage: "uv cache dir [OPTIONS]"
  - name: self
    description: "Manage the uv executable"
    usage: "uv self [OPTIONS] <COMMAND>"
    subcommands:
      - name: update
        description: "Update uv"
        usage: "uv self update [OPTIONS] [TARGET_VERSION]"
        pool:
          options:
            - {name: Token, kind: flag, type: string, long: --token, description: "A GitHub token for authentication. A token is not required but can be used to reduce the chance of encountering rate limits"}
            - {name: Dry Run, kind: flag, type: bool, long: --dry-run, description: "Run without performing the update"}
            - {name: TARGET_VERSION, kind: positional, type: string, description: "Update to the specified version. If not provided, uv will update to the latest version"}
        options: [Token, Dry Run, TARGET_VERSION]
      - name: version
        description: "Display uv's version"
        usage: "uv self version [OPTIONS]"
        pool:
          options:
            - {name: Short, kind: flag, type: bool, long: --short, description: "Only print the version"}
            - {name: Output Format, kind: flag, type: enum, long: --output-format, values: [text, json]}
        options: [Short, Output Format]
  - name: help
    description: "Display documentation for a command"
    usage: "uv help [OPTIONS] [COMMAND]..."
    pool:
      options:
        - {name: No Pager, kind: flag, type: bool, long: --no-pager, description: "Disable pager when printing help"}
        - {name: COMMAND, kind: positional, type: passthrough}
    options: [No Pager, COMMAND]
