        - {name: Frozen, kind: flag, type: bool, long: --frozen, description: "Remove dependencies without re-locking the project"}
        - {name: Package, kind: flag, type: string, long: --package, description: "Remove the dependencies from a specific package in the workspace"}
        - {name: Script, kind: flag, type: string, long: --script, description: "Remove the dependency from the specified Python script, rather than from a project"}
