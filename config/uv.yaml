            - {name: Package, kind: flag, type: string, long: --package, description: "Display only the specified packages"}
            - {name: No Dedupe, kind: flag, type: bool, long: --no-dedupe, description: "Do not de-duplicate repeated dependencies. Usually, when a package has already displayed its dependencies, further occurrences will not re-display its dependencies, and will include a (*) to indicate it has already been shown. This flag will cause those duplicates to be repeated"}
