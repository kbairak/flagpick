  - name: publish
    description: "Upload distributions to an index"
    usage: "uv publish [OPTIONS] [FILES]..."
    pool:
      options:
        - {name: Index, kind: flag, type: string, long: --index, repeatable: true, description: "The name of an index in the configuration to use for publishing."}
        - {name: Username, kind: flag, type: string, long: --username, short: "-u", description: "The username for the upload"}
        - {name: Password, kind: flag, type: string, long: --password, short: "-p", description: "The password for the upload"}
        - {name: Token, kind: flag, type: string, long: --token, short: "-t", description: "The token for the upload"}
        - {name: Trusted Publishing, kind: flag, type: enum, long: --trusted-publishing, values: [automatic, always, never], description: "Configure using trusted publishing through GitHub Actions"}
        - {name: Keyring Provider, kind: flag, type: enum, long: --keyring-provider, values: [disabled, subprocess], description: "Attempt to use `keyring` for authentication for remote requirements files"}
        - {name: Publish URL, kind: flag, type: string, long: --publish-url, description: "The URL of the upload endpoint (not the index URL)"}
        - {name: Check URL, kind: flag, type: string, long: --check-url, description: "Check an index URL for existing files to skip duplicate uploads"}
        - {name: FILES, kind: positional, type: string, variadic: true, description: "Paths to the files to upload. Accepts glob expressions"}
